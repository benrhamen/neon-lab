function paProfile(){try{var o=JSON.parse(localStorage.getItem("pa.profile.v1"));if(!o||typeof o!=="object")return null;
 var h=function(v){return /^#[0-9a-fA-F]{6}$/.test(v)?v.toLowerCase():null};
 var base={curly:"short",afro:"short",buzz:"short",sidepart:"short",undercut:"short",bob:"long",braids:"long",wavy:"long",mullet:"long",topknot:"bun",twinbuns:"bun",messy:"spiky"};
 var st=String(o.hairStyle||"short");
 return {name:String(o.name||"").replace(/[^A-Za-z0-9 \-!._]/g,"").slice(0,12),skin:(o.skin|0),hairColor:(o.hairColor|0),outfit:(o.outfit|0),
  skinHex:h(o.skinHex),hairHex:h(o.hairHex),outfitHex:h(o.outfitHex),accentHex:h(o.accentHex),eyeHex:h(o.eyeHex),
  hairStyle:st,hairBase:base[st]||st,eyes:o.eyes|0,mouth:o.mouth|0,outfitStyle:o.outfitStyle|0,accessory:String(o.accessory||"none"),extras:(o.extras&&typeof o.extras==="object")?o.extras:{}}}catch(e){return null}}
const EDIT_URL="https://benrhamen.github.io/pixel-arcade/?back="+encodeURIComponent(location.href)+"#character";
function paLook(p){const g=(a,i,d)=>(a[i]!==undefined?a[i]:d);const hm={bald:0,short:1,spiky:2,mohawk:2,long:3,ponytail:4,pigtails:4,bun:5},hi=hm[p.hairBase]!==undefined?hm[p.hairBase]:1;
return{skin:g([0,1,1,2,2,2,4,5,0],p.skin,0),hair:hi,hc:g([1,0,0,2,3,4,3,2],p.hairColor,0),robe:g([0,1,2,3,5,4,3,1],p.outfit,0),gog:0,
sh:p.skinHex||undefined,hh:p.hairHex||undefined,oh:p.outfitHex||undefined,ah:p.accentHex||undefined,eh:p.eyeHex||undefined,
hs:p.hairStyle,pe:p.eyes,pm:p.mouth,os:p.outfitStyle,ac:p.accessory,x:p.extras}}
function paApply(force){const p=paProfile();if(!p)return false;P.av=paLook(p);if(p.name)P.name=p.name;if(force)P.custom=0;save();return true}
paApply(false);
addEventListener('focus',()=>{if(paApply(false))render()});addEventListener('storage',e=>{if(e.key=='pa.profile.v1'&&paApply(false))render()});

return `<svg class="bone-model" viewBox="0 0 300 407" role="img" aria-label="Simplified front-view skeleton. ${BONESET.filter(b=>got(b.id)).length} of 21 bone groups found."><rect x="5" y="5" width="290" height="396" rx="35" fill="#172f42"/><circle cx="150" cy="170" r="110" fill="#203d4d"/><g fill="#9ee3d3" opacity=".7"><path d="M61 52l3 7 7 3-7 3-3 7-3-7-7-3 7-3Z"/><path d="M234 165l3 7 7 3-7 3-3 7-3-7-7-3 7-3Z"/><rect x="58" y="295" width="5" height="5" rx="1"/><rect x="231" y="80" width="5" height="5" rx="1"/></g>${o}<text x="150" y="398" text-anchor="middle" fill="#a9c9d4" font-size="10">FRONT VIEW · PALMS FORWARD</text></svg>`}
function boneStart(practice=false){const rest=BONESET.filter(b=>practice||!P.bones[b.id]);S.bn={queue:shuf(rest.map(b=>b.id)),i:0,feedback:null,detail:null,practice};boneQuestion();}
function boneQuestion(){const st=S.bn;if(!st||!st.queue.length)return;const id=st.queue[st.i];st.options=shuf([id,...shuf(BONESET.filter(b=>b.id!==id).map(b=>b.id)).slice(0,3)]);st.feedback=null;st.hint=false;st.detail=null;}
function bonesScr(){if(!S.bn)boneStart();const st=S.bn,n=BONESET.filter(b=>P.bones[b.id]).length,b=BONESET.find(b=>b.id===st.queue[st.i]),detail=BONESET.find(b=>b.id===st.detail);return `<button class="btn" data-a="go" data-s="bio">All biology gardens</button><div class="bone-title"><div><small class="dim">BONES WORKSHOP</small><h1>Build a bone buddy</h1></div>${boneBadge('skull')}</div><p class="dim">Find the bone from the clue. Every discovery brings your skeleton to life.</p><div class="bio-progress"><b>${n}/21 groups found</b><progress value="${n}" max="21" aria-label="Bone collection progress"></progress></div><div class="bone-work"><div class="bone-stage">${boneModel()}<p class="dim bone-note">Simplified model, not all 206 adult bones. Pairs and small bones are collected in groups. Shoulder blades are shown through the chest.</p></div><div class="bone-task">${b?`<div class="panel bone-clue"><small class="dim">${st.practice?'PRACTICE':'FIND THE BONE'} · ${st.i+1}/${st.queue.length}</small><h2>${esc(b.clue)}</h2>${st.hint?`<p class="bone-hint">${esc(b.hint)}</p>`:`<button class="btn bone-hint-btn" data-a="bonehint">Small hint</button>`}</div>${st.feedback?`<div class="panel ${st.feedback.ok?'glow':''}" role="status"><b>${st.feedback.ok?'Found: '+esc(b.name)+'!':'That is '+esc(st.feedback.name)+'. Find '+esc(b.name)+'.'}</b><p>${esc(b.fact)}</p>${st.feedback.ok?`<small class="dim">${st.feedback.fresh?'Added to your skeleton. +1 star.':'Already collected. Practice gives no extra star.'}</small>`:'<small class="dim">Try the tray again. No star lost or earned.</small>'}<p class="src"><a href="${b.source}" target="_blank" rel="noopener">OpenStax · bone facts</a></p></div>`:''}${!st.feedback||!st.feedback.ok?`<div class="bone-tray" aria-label="Choose a bone">${st.options.map(id=>`<button class="bone-choice" data-a="bonepick" data-id="${id}">${boneBadge(id)}<span>${esc(BONESET.find(b=>b.id===id).name)}</span></button>`).join('')}</div>`:`<button class="btn pri big" data-a="bonenext">${st.i+1<st.queue.length?'Next bone':'Meet your bone buddy'}</button>`}`:`<div class="panel glow"><h2>Your bone buddy is complete!</h2><p>21 bone groups, from skull to toes. Tap a found bone on the model to read its fact.</p><button class="btn pri big" data-a="bonepractice">Play again</button><p class="dim">Practice keeps your collection and gives no extra stars.</p></div>`}${detail?`<div class="panel" role="status"><b>${esc(detail.name)}</b><p>${P.bones[detail.id]?esc(detail.fact):'Still missing. Keep finding bones to add this group.'}</p><a href="${detail.source}" target="_blank" rel="noopener">OpenStax · learn more</a></div>`:''}</div></div><details class="panel bone-library"><summary>Your bone collection · ${n}/21</summary><div class="bone-collection">${BONESET.map(b=>`<button class="bone-library-item ${P.bones[b.id]?'collected':''}" data-a="bonedetail" data-id="${b.id}">${boneBadge(b.id)}<span>${esc(b.name)}<small>${P.bones[b.id]?'Found':'Not found'} · ${b.region}</small></span></button>`).join('')}</div></details>`}
function boneAct(a,id){if(a==='bonehint'){S.bn.hint=true;render();return true}if(a==='bonepractice'){boneStart(true);render();scrollTo(0,0);return true}if(a==='bonedetail'){S.bn.detail=id;render();return true}if(a==='bonenext'){S.bn.i++;boneQuestion();render();scrollTo(0,0);return true}if(a==='bonepick'){const st=S.bn,b=BONESET.find(b=>b.id===st.queue[st.i]);if(!b||st.feedback?.ok||!st.options.includes(id))return true;const ok=id===b.id,fresh=ok&&!P.bones[id];if(ok){P.bones[id]=1;if(fresh)P.stars++;save()}st.feedback={ok,fresh,name:BONESET.find(b=>b.id===id).name};render();return true}return false}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,i=el.dataset.i;if(el.tagName=='A')e.preventDefault();if(a=='closebg'&&e.target!==el)return;

case'tab':S.tab=i;render();return;

case'dpatch':dnaCheck('c'+S.dna.l);return;
case'dnext':{const D=S.dna;if(D.i>=5){const avg=Math.round(D.sc.reduce((x,y)=>x+y,0)/D.sc.length);lbAdd('dna'+D.l,avg);if(avg>=85)P.stars++;save();D.q=checkQuests();D.st='end'}else{D.i++;dnamk()}render();scrollTo(0,0);return}
}});
// level 1 base picks
document.addEventListener('click',e=>{const el=e.target.closest('[data-a="pb"]');if(el&&S.scr=='dna'&&S.dna.l==1&&S.dna.st=='ask'&&S.dna.ans.length<6){S.dna.ans.push(el.dataset.i);sfx.pop();render()}},true);

/* ===== Clue ladder: guess the element (30 s, 5 clues, 5 to 1 points) ===== */
const CLUE_EASY=['H','He','Li','C','N','O','F','Ne','Na','Mg','Al','Si','P','S','Cl','Ar','K','Ca','Ti','Fe','Ni','Cu','Zn','Ag','Sn','I','Pt','Au','Hg','Pb','U'];
const CLUE_ALIAS={'Aluminium':['aluminum'],'Sulfur':['sulphur'],'Caesium':['cesium'],'Aluminum':['aluminium'],'Cesium':['caesium']};
const CLUE_LV=[['easy','Easy','Famous elements'],['med','Medium','Elements 1 to 56'],['hard','Hard','All 118 elements']];
const CLUE_NEED=3,CLUE_PASS=7,CLUE_Q=10,CLUE_T=30;
const CL={mode:'mc',lvl:'easy',qs:[],i:0,pts:0,got:0,t0:0,wrong:0,off:[],ph:'menu',tm:null,res:null,live:false};
function clueSt(){if(!P.clue)P.clue={mc:{easy:0,med:0,hard:0},ty:{easy:0,med:0,hard:0},best:{}};if(!P.clue.best)P.clue.best={};['mc','ty'].forEach(m=>{if(!P.clue[m])P.clue[m]={easy:0,med:0,hard:0}});return P.clue}
function clueOpen(m,l){const c=clueSt();return l=='easy'||(l=='med'&&c[m].easy>=CLUE_NEED)||(l=='hard'&&c[m].med>=CLUE_NEED)}
function clueDots(n){let s='';for(let k=0;k<CLUE_NEED;k++)s+=k<n?'\u25CF':'\u25CB';return s}
function cluePool(l){return PT.filter(e=>l=='easy'?CLUE_EASY.includes(e[1]):l=='med'?e[0]<=56:true)}
function clueK(v){return Math.round(v-273.15)}
function clueClues(e){const[Z,sym,name,mass,cat,grp,per,state,melt,boil,dens,disc]=e;const out=[];
out.push(`It is a ${cat}${state?'. At room temperature it is a '+String(state).toLowerCase():''}.`);
let t=[];if(melt)t.push('melts at '+clueK(melt)+'\u00B0C');if(boil)t.push('boils at '+clueK(boil)+'\u00B0C');if(dens)t.push('density '+dens+' g/cm\u00B3');
out.push(t.length?'It '+t.join(', ')+'.':'It is very hard to measure: only a few atoms were ever made.');
out.push((cat=='lanthanide'||cat=='actinide')?`It sits in the f-block, in period ${per}.`:`It is in group ${grp}, period ${per} of the periodic table.`);
let uses=null;try{for(const k of Object.keys(PR)){const r=PR[k];if(r&&r.ing&&r.ing[sym]&&r.n&&!r.n.toLowerCase().includes(name.toLowerCase())&&(r.f||'').length<9){uses=r;break}}}catch(_){}
out.push(uses?`It is in ${uses.n} (${uses.f}), which ${uses.use}.`:(disc?(/^(unknown|\d)/i.test(disc)?'Known since '+disc.replace(/^unknown,\s*/i,'')+'.':'First isolated or found by '+disc+'.'):`Its atomic mass is about ${Math.round(mass)}.`));
out.push(`Atomic number ${Z}. Its name starts with "${name[0]}" and its symbol begins with ${sym[0]}.`);
return out}
function clueQs(l){return shuf(cluePool(l)).slice(0,CLUE_Q)}
function clueOpts(e){const same=cluePool(CL.lvl).filter(x=>x!==e&&x[4]==e[4]&&Math.abs(x[0]-e[0])<30);const rest=cluePool(CL.lvl).filter(x=>x!==e&&!same.includes(x));const pool=shuf(same).slice(0,5);let extra=shuf(rest);while(pool.length<5)pool.push(extra.pop());return shuf([e].concat(pool))}
function clueNorm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'')}
function clueOk(e,s){const n=clueNorm(s);if(!n)return false;if(n==clueNorm(e[2]))return true;return(CLUE_ALIAS[e[2]]||[]).some(a=>clueNorm(a)==n)}
function clueEl(){return CL.qs[CL.i]}
function clueElapsed(){return(Date.now()-CL.t0)/1000}
function clueNow(){const t=clueElapsed();return{t,n:Math.min(5,Math.floor(t/6)+1),pts:Math.max(1,5-Math.floor(t/6))}}
function clueMenuScr(){const c=clueSt();let h='<h1>Clue ladder</h1><p class="dim">An element hides behind 5 clues. The first clue is broad and a new clue appears every 6 seconds, each one easier. The sooner you guess, the more points: 5, 4, 3, 2, 1. A round is 10 elements, 30 seconds each.</p>';
['mc','ty'].forEach(m=>{h+=`<div class="panel"><b>${m=='mc'?'Pick from 6 answers':'Type your own answer (harder)'}</b>`+CLUE_LV.map(([l,nm,sub])=>{const open=clueOpen(m,l),prev=l=='med'?'easy':'med',cnt=c[m][l],b=(c.best[m+l]||0);return open?`<button class="btn big" style="margin-top:8px;text-align:left" data-a="clueplay" data-m="${m}" data-l="${l}">${nm} <span class="dim sm">${sub}</span><br><span class="sm">${clueDots(Math.min(cnt,CLUE_NEED))} cleared ${Math.min(cnt,CLUE_NEED)}/${CLUE_NEED}${cnt>=CLUE_NEED&&l!='hard'?' \u00B7 next level open':''}${b?' \u00B7 best '+b+'/50':''}</span></button>`:`<button class="btn big" style="margin-top:8px;text-align:left;opacity:.7" disabled>\uD83D\uDD12 ${nm} <span class="dim sm">${sub}</span><br><span class="sm">Clear ${prev=='easy'?'Easy':'Medium'} ${CLUE_NEED} times to unlock (${Math.min(c[m][prev],CLUE_NEED)}/${CLUE_NEED})</span></button>`}).join('')+'</div>'});
return h+`<p class="dim sm">To clear a level, find at least ${CLUE_PASS} of the 10 elements before time runs out. A wrong answer costs 1 point on that question.</p>`}
function clueQHTML(){const e=clueEl(),n=clueNow(),cl=clueClues(e);let h=`<div class="row" style="justify-content:space-between"><b>Element ${CL.i+1} / ${CLUE_Q}</b><b id="cl-sc">${CL.pts} pts</b></div><div style="height:12px;border:2px solid var(--c1);border-radius:8px;overflow:hidden;margin:8px 0"><div id="cl-bar" style="height:100%;width:100%;background:var(--c3)"></div></div><div class="row" style="justify-content:space-between"><span id="cl-t" class="dim">30 s</span><b id="cl-pts" style="font-size:20px">5 pts</b></div><div id="cl-clues"></div>`;
if(CL.mode=='mc')h+='<div id="cl-opts" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">'+CL.opts.map((o,k)=>`<button class="btn" data-a="clueans" data-k="${k}" id="cl-o${k}">${esc(o[2])}</button>`).join('')+'</div>';
else h+=`<form id="cl-form" style="display:flex;gap:8px;margin-top:10px"><input id="cl-in" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Type the element name" style="flex:1;min-height:46px;font-size:16px;padding:8px 10px;border:3px solid var(--ink);border-radius:12px"><button class="btn pri" type="submit">Guess</button></form><div id="cl-msg" class="sm" style="min-height:20px;margin-top:6px"></div>`;
return h}
function clueShowClues(){const e=clueEl(),n=clueNow().n,cl=clueClues(e);const box=document.getElementById('cl-clues');if(!box)return;box.innerHTML=cl.slice(0,n).map((c,k)=>`<div class="fact" ${k==n-1?'style="border-left-color:var(--c4);background:#fff1b8"':''}><b>Clue ${k+1}</b><br>${esc(c)}</div>`).join('')}
function clueTick(){if(S.scr!='clue'||CL.ph!='q'){clearInterval(CL.tm);return}const x=clueNow();if(x.t>=CLUE_T){clueEnd(false,0);return}
const b=document.getElementById('cl-bar'),t=document.getElementById('cl-t'),p=document.getElementById('cl-pts');if(b){b.style.width=(100-x.t/CLUE_T*100)+'%';b.style.background=x.t>24?'var(--bad)':x.t>12?'var(--c4)':'var(--c3)'}if(t)t.textContent=Math.ceil(CLUE_T-x.t)+' s';if(p)p.textContent=Math.max(0,x.pts-CL.wrong)+' pts';if(CL.shown!=x.n){CL.shown=x.n;clueShowClues()}}
function clueStart(m,l){if(!clueOpen(m,l))return;CL.mode=m;CL.lvl=l;CL.qs=clueQs(l);CL.i=0;CL.pts=0;CL.got=0;CL.res=null;CL.live=true;clueNext(true)}
function clueNext(first){CL.ph='q';CL.wrong=0;CL.off=[];CL.opts=CL.mode=='mc'?clueOpts(clueEl()):null;CL.t0=Date.now();CL.shown=0;if(first)go('clue');else render();clueShowClues();clearInterval(CL.tm);CL.tm=setInterval(clueTick,200);clueTick();const i=document.getElementById('cl-in');if(i)i.focus()}
function clueEnd(ok,pts){clearInterval(CL.tm);CL.ph='fb';CL.last={ok:ok,pts:pts,el:clueEl(),t:clueElapsed()};if(ok){CL.pts+=pts;CL.got++}if(ok){try{sfx.ok()}catch(_){}}else{try{sfx.bad()}catch(_){}}render()}
function clueFB(){const L=CL.last,e=L.el,fin=CL.i>=CLUE_Q-1;return `<div class="row" style="justify-content:space-between"><b>Element ${CL.i+1} / ${CLUE_Q}</b><b>${CL.pts} pts</b></div><div class="panel glow" style="text-align:center"><div style="font-size:38px;font-weight:800">${esc(e[1])}</div><h2 style="margin:4px 0">${esc(e[2])}</h2><p class="${L.ok?'ok':''}" style="font-weight:800">${L.ok?'Found! +'+L.pts+(L.pts==1?' point':' points'):'Not found this time. 0 points.'}</p><p class="dim sm">Atomic number ${e[0]} \u00B7 ${esc(e[4])}</p></div><button class="btn pri big" data-a="${fin?'cluefin':'cluenext'}">${fin?'See my result':'Next element \u25B6'}</button>`}
function clueRes(){const c=clueSt(),cleared=CL.got>=CLUE_PASS,m=CL.mode,l=CL.lvl,nm=CLUE_LV.find(x=>x[0]==l)[1];const unlockedNow=cleared&&l!='hard'&&c[m][l]==CLUE_NEED;return `<h1>Round over</h1><div class="panel glow" style="text-align:center"><div style="font-size:44px;font-weight:800">${CL.pts} <span class="dim" style="font-size:20px">/ 50 pts</span></div><p>${CL.got} of ${CLUE_Q} elements found</p><p class="${cleared?'ok':''}" style="font-weight:800">${cleared?'Level cleared! ('+nm+' '+Math.min(c[m][l],CLUE_NEED)+'/'+CLUE_NEED+')':'Not cleared. Find at least '+CLUE_PASS+' to clear it.'}</p>${unlockedNow?'<p class="ok" style="font-weight:800">Next level unlocked!</p>':''}</div><div class="row" style="margin-top:10px"><button class="btn pri" data-a="clueplay" data-m="${m}" data-l="${l}">Play again</button><button class="btn" data-a="clueback">Levels</button></div>`}
const _scrC=scr;scr=function(){if(S.scr=='cluemenu')return clueMenuScr();if(S.scr=='clue'){return CL.ph=='q'?clueQHTML():CL.ph=='fb'?clueFB():clueRes()}return _scrC()};
const _menuC=menu;menu=function(){let h=_menuC();const b=`<div class="branch"><div class="bhead" style="background:linear-gradient(135deg,#ffb84d,#ff7a5c)"><img src="${icon('atom','#fff','#ffe066')}"><div><b>Clue ladder</b><span>Guess the element from clues</span></div></div><div class="bbtns"><button class="bb w" style="--bc:#ffe9a8" data-a="clueopen">Play the clue ladder<small>10 elements \u00B7 30 s \u00B7 5 to 1 points</small></button></div></div>`;const k='<div class="branch soon">';return h.includes(k)?h.replace(k,b+k):h+b};
const _inR=inRound;inRound=function(){return _inR()||(S.scr=='clue'&&CL.ph=='q')};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a^="clue"]');if(!el)return;const a=el.dataset.a;
if(a=='clueopen'){go('cluemenu');return}
if(a=='clueplay'){clueStart(el.dataset.m,el.dataset.l);return}
if(a=='clueback'){clearInterval(CL.tm);CL.live=false;go('cluemenu');return}
if(a=='cluenext'){CL.i++;clueNext(false);return}
if(a=='cluefin'){clearInterval(CL.tm);CL.live=false;const c=clueSt(),m=CL.mode,l=CL.lvl;if(CL.got>=CLUE_PASS)c[m][l]=(c[m][l]||0)+1;const bk=m+l;if(!c.best[bk]||CL.pts>c.best[bk])c.best[bk]=CL.pts;if(CL.pts>0)lbAdd('clue_'+bk,CL.pts,'pts');save();CL.ph='res';render();return}
if(a=='clueans'&&CL.ph=='q'){const k=+el.dataset.k,o=CL.opts[k],x=clueNow();if(o===clueEl()){clueEnd(true,Math.max(0,x.pts-CL.wrong))}else{CL.wrong++;el.disabled=true;el.style.opacity='.35';try{sfx.bad()}catch(_){}}}
},true);
document.addEventListener('submit',e=>{if(e.target.id!='cl-form')return;e.preventDefault();if(CL.ph!='q')return;const i=document.getElementById('cl-in'),v=i.value,x=clueNow();if(clueOk(clueEl(),v)){clueEnd(true,Math.max(0,x.pts-CL.wrong))}else{CL.wrong++;const m=document.getElementById('cl-msg');if(m)m.textContent='Not it. -1 point on this element.';i.value='';i.focus();try{sfx.bad()}catch(_){}}});

document.addEventListener('click',e=>{const el=e.target.closest('[data-a="qdtog"]');if(!el)return;e.stopPropagation();S.qd=!S.qd;render()},true);
if(window.__BK){__BK.noPush=['clue'];__BK.go=function(p){if(S.scr=='clue'&&CL.ph=='q'&&!confirm('Leave this round? Your progress in it will be lost.'))return;clearInterval(CL.tm);CL.live=false;go(p)}}
