const PT=[[1,"H","Hydrogen",1.008,"diatomic nonmetal",1,1,"Gas",13.99,20.271,0.0,"Henry Cavendish","Antoine Lavoisier",1,1,"Hydrogen is a chemical element with chemical symbol H and atomic number 1. With an atomic weight of 1.00794 u, hydrogen is the lightest element on the periodic table. Its monatomic form (H) is the most abundant chemical substance in the Universe, constituting roughly 75% of all baryonic mass."],[2,"He","Helium",4.003,"noble gas",18,1,"Gas",0.95,4.222,0.0,"Pierre Janssen",null,18,1,"Helium is a chemical element with symbol He and atomic number 2. It is a colorless, odorless, tasteless, non-toxic, inert, monatomic gas that heads the noble gas group in the periodic table. Its boiling and melting points are the lowest among all the elements."],[3,"Li","Lithium",6.94,"alkali metal",1,2,"Solid",453.65,1603.0,0.534,"Johan August Arfwedson",null,1,2,"Lithium (from Greek:λίθος lithos, \"stone\") is a chemical element with the symbol Li and atomic number 3. It is a soft, silver-white metal belonging to the alkali metal group of chemical elements. Under standard conditions it is the lightest metal and the least dense solid element."],[4,"Be","Beryllium",9.012,"alkaline earth metal",2,2,"Solid",1560.0,2742.0,1.85,"Louis Nicolas Vauquelin",null,2,2,"Beryllium is a chemical element with symbol Be and atomic number 4. It is created through stellar nucleosynthesis and is a relatively rare element in the universe. It is a divalent element which occurs naturally only in combination with other elements in minerals."],[5,"B","Boron",10.81,"metalloid",13,2,"Solid",2349.0,4200.0,2.08,"Joseph Louis Gay-Lussac",null,13,2,"Boron is a metalloid chemical element with symbol B and atomic number 5. Produced entirely by cosmic ray spallation and supernovae and not by stellar nucleosynthesis, it is a low-abundance element in both the Solar system and the Earth's crust."],[6,"C","Carbon",12.011,"polyatomic nonmetal",14,2,"Solid",4600.0,null,1.821,"Ancient Egypt",null,14,2,"Carbon (from Latin:carbo \"coal\") is a chemical element with symbol C and atomic number 6. On the periodic table, it is the first (row 2) of six elements in column (group) 14, which have in common the composition of their outer electron shell. It is nonmetallic and tetravalent—making four electrons available to form covalent chemical bonds."],[7,"N","Nitrogen",14.007,"diatomic nonmetal",15,2,"Gas",63.15,77.355,0.001,"Daniel Rutherford","Jean-Antoine Chaptal",15,2,"Nitrogen is a chemical element with symbol N and atomic number 7. It is the lightest pnictogen and at room temperature, it is a transparent, odorless diatomic gas. Nitrogen is a common element in the universe, estimated at about seventh in total abundance in the Milky Way and the Solar System."],[8,"O","Oxygen",15.999,"diatomic nonmetal",16,2,"Gas",54.36,90.188,0.001,"Carl Wilhelm Scheele","Antoine Lavoisier",16,2,"Oxygen is a chemical element with symbol O and atomic number 8. It is a member of the chalcogen group on the periodic table and is a highly reactive nonmetal and oxidizing agent that readily forms compounds (notably oxides) with most elements. By mass, oxygen is the third-most abundant element in the universe, after hydrogen and helium."],[9,"F","Fluorine",18.998,"diatomic nonmetal",17,2,"Gas",53.48,85.03,0.002,"André-Marie Ampère","Humphry Davy",17,2,"Fluorine is a chemical element with symbol F and atomic number 9. It is the lightest halogen and exists as a highly toxic pale yellow diatomic gas at standard conditions. As the most electronegative element, it is extremely reactive:almost all other elements, including some noble gases, form compounds with fluorine."],[10,"Ne","Neon",20.18,"noble gas",18,2,"Gas",24.56,27.104,0.001,"Morris Travers",null,18,2,"Neon is a chemical element with symbol Ne and atomic number 10. It is in group 18 (noble gases) of the periodic table. Neon is a colorless, odorless, inert monatomic gas under standard conditions, with about two-thirds the density of air."],[11,"Na","Sodium",22.99,"alkali metal",1,3,"Solid",370.944,1156.09,0.968,"Humphry Davy",null,1,3,"Sodium /ˈsoʊdiəm/ is a chemical element with symbol Na (from Ancient Greek Νάτριο) and atomic number 11. It is a soft, silver-white, highly reactive metal."],[12,"Mg","Magnesium",24.305,"alkaline earth metal",2,3,"Solid",923.0,1363.0,1.738,"Joseph Black",null,2,3,"Magnesium is a chemical element with symbol Mg and atomic number 12."],[13,"Al","Aluminium",26.982,"post-transition metal",13,3,"Solid",933.47,2743.0,2.7,null,"Humphry Davy",13,3,"Aluminium (or aluminum; see different endings) is a chemical element in the boron group with symbol Al and atomic number 13. It is a silvery-white, soft, nonmagnetic, ductile metal. Aluminium is the third most abundant element (after oxygen and silicon), and the most abundant metal, in the Earth's crust."],[14,"Si","Silicon",28.085,"metalloid",14,3,"Solid",1687.0,3538.0,2.329,"Jöns Jacob Berzelius","Thomas Thomson (chemist)",14,3,"Silicon is a chemical element with symbol Si and atomic number 14. It is a tetravalent metalloid, more reactive than germanium, the metalloid directly below it in the table. Controversy about silicon's character dates to its discovery."],[15,"P","Phosphorus",30.974,"polyatomic nonmetal",15,3,"Solid",317.3,null,1.823,"Hennig Brand",null,15,3,"Phosphorus is a chemical element with symbol P and atomic number 15. As an element, phosphorus exists in two major forms—white phosphorus and red phosphorus—but due to its high reactivity, phosphorus is never found as a free element on Earth."],[16,"S","Sulfur",32.06,"polyatomic nonmetal",16,3,"Solid",388.36,717.8,2.07,"Ancient china",null,16,3,"Sulfur or sulphur (see spelling differences) is a chemical element with symbol S and atomic number 16. It is an abundant, multivalent non-metal. Under normal conditions, sulfur atoms form cyclic octatomic molecules with chemical formula S8."],[17,"Cl","Chlorine",35.45,"diatomic nonmetal",17,3,"Gas",171.6,239.11,0.003,"Carl Wilhelm Scheele",null,17,3,"Chlorine is a chemical element with symbol Cl and atomic number 17. It also has a relative atomic mass of 35.5. Chlorine is in the halogen group (17) and is the second lightest halogen following fluorine."],[18,"Ar","Argon",39.948,"noble gas",18,3,"Gas",83.81,87.302,0.002,"Lord Rayleigh",null,18,3,"Argon is a chemical element with symbol Ar and atomic number 18. It is in group 18 of the periodic table and is a noble gas."],[19,"K","Potassium",39.098,"alkali metal",1,4,"Solid",336.7,1032.0,0.862,"Humphry Davy",null,1,4,"Potassium is a chemical element with symbol K (derived from Neo-Latin, kalium) and atomic number 19. It was first isolated from potash, the ashes of plants, from which its name is derived."],[20,"Ca","Calcium",40.078,"alkaline earth metal",2,4,"Solid",1115.0,1757.0,1.55,"Humphry Davy",null,2,4,"Calcium is a chemical element with symbol Ca and atomic number 20. Calcium is a soft gray alkaline earth metal, fifth-most-abundant element by mass in the Earth's crust. The ion Ca2+ is also the fifth-most-abundant dissolved ion in seawater by both molarity and mass, after sodium, chloride, magnesium, and sulfate."],[21,"Sc","Scandium",44.956,"transition metal",3,4,"Solid",1814.0,3109.0,2.985,"Lars Fredrik Nilson",null,3,4,"Scandium is a chemical element with symbol Sc and atomic number 21. A silvery-white metallic d-block element, it has historically been sometimes classified as a rare earth element, together with yttrium and the lanthanoids. It was discovered in 1879 by spectral analysis of the minerals euxenite and gadolinite from Scandinavia."],[22,"Ti","Titanium",47.867,"transition metal",4,4,"Solid",1941.0,3560.0,4.506,"William Gregor","Martin Heinrich Klaproth",4,4,"Titanium is a chemical element with symbol Ti and atomic number 22. It is a lustrous transition metal with a silver color, low density and high strength. It is highly resistant to corrosion in sea water, aqua regia and chlorine."],[23,"V","Vanadium",50.942,"transition metal",5,4,"Solid",2183.0,3680.0,6.0,"Andrés Manuel del Río","Isotopes of vanadium",5,4,"Vanadium is a chemical element with symbol V and atomic number 23. It is a hard, silvery grey, ductile and malleable transition metal. The element is found only in chemically combined form in nature, but once isolated artificially, the formation of an oxide layer stabilizes the free metal somewhat against further oxidation."],[24,"Cr","Chromium",51.996,"transition metal",6,4,"Solid",2180.0,2944.0,7.19,"Louis Nicolas Vauquelin",null,6,4,"Chromium is a chemical element with symbol Cr and atomic number 24. It is the first element in Group 6. It is a steely-gray, lustrous, hard and brittle metal which takes a high polish, resists tarnishing, and has a high melting point."],[25,"Mn","Manganese",54.938,"transition metal",7,4,"Solid",1519.0,2334.0,7.21,"Torbern Olof Bergman",null,7,4,"Manganese is a chemical element with symbol Mn and atomic number 25. It is not found as a free element in nature; it is often found in combination with iron, and in many minerals. Manganese is a metal with important industrial metal alloy uses, particularly in stainless steels."],[26,"Fe","Iron",55.845,"transition metal",8,4,"Solid",1811.0,3134.0,7.874,"5000 BC",null,8,4,"Iron is a chemical element with symbol Fe (from Latin:ferrum) and atomic number 26. It is a metal in the first transition series. It is by mass the most common element on Earth, forming much of Earth's outer and inner core."],[27,"Co","Cobalt",58.933,"transition metal",9,4,"Solid",1768.0,3200.0,8.9,"Georg Brandt",null,9,4,"Cobalt is a chemical element with symbol Co and atomic number 27. Like nickel, cobalt in the Earth's crust is found only in chemically combined form, save for small deposits found in alloys of natural meteoric iron. The free element, produced by reductive smelting, is a hard, lustrous, silver-gray metal."],[28,"Ni","Nickel",58.693,"transition metal",10,4,"Solid",1728.0,3003.0,8.908,"Axel Fredrik Cronstedt",null,10,4,"Nickel is a chemical element with symbol Ni and atomic number 28. It is a silvery-white lustrous metal with a slight golden tinge. Nickel belongs to the transition metals and is hard and ductile."],[29,"Cu","Copper",63.546,"transition metal",11,4,"Solid",1357.77,2835.0,8.96,"Middle East",null,11,4,"Copper is a chemical element with symbol Cu (from Latin:cuprum) and atomic number 29. It is a soft, malleable and ductile metal with very high thermal and electrical conductivity. A freshly exposed surface of pure copper has a reddish-orange color."],[30,"Zn","Zinc",65.382,"transition metal",12,4,"Solid",692.68,1180.0,7.14,"India",null,12,4,"Zinc, in commerce also spelter, is a chemical element with symbol Zn and atomic number 30. It is the first element of group 12 of the periodic table. In some respects zinc is chemically similar to magnesium:its ion is of similar size and its only common oxidation state is +2."],[31,"Ga","Gallium",69.723,"post-transition metal",13,4,"Solid",302.915,2673.0,5.91,"Lecoq de Boisbaudran",null,13,4,"Gallium is a chemical element with symbol Ga and atomic number 31. Elemental gallium does not occur in free form in nature, but as the gallium(III) compounds that are in trace amounts in zinc ores and in bauxite."],[32,"Ge","Germanium",72.631,"metalloid",14,4,"Solid",1211.4,3106.0,5.323,"Clemens Winkler",null,14,4,"Germanium is a chemical element with symbol Ge and atomic number 32. It is a lustrous, hard, grayish-white metalloid in the carbon group, chemically similar to its group neighbors tin and silicon. Purified germanium is a semiconductor, with an appearance most similar to elemental silicon."],[33,"As","Arsenic",74.922,"metalloid",15,4,"Solid",1090.0,null,5.727,"Bronze Age",null,15,4,"Arsenic is a chemical element with symbol As and atomic number 33. Arsenic occurs in many minerals, usually in conjunction with sulfur and metals, and also as a pure elemental crystal. Arsenic is a metalloid."],[34,"Se","Selenium",78.972,"polyatomic nonmetal",16,4,"Solid",494.0,958.0,4.81,"Jöns Jakob Berzelius",null,16,4,"Selenium is a chemical element with symbol Se and atomic number 34. It is a nonmetal with properties that are intermediate between those of its periodic table column-adjacent chalcogen elements sulfur and tellurium. It rarely occurs in its elemental state in nature, or as pure ore compounds."],[35,"Br","Bromine",79.904,"diatomic nonmetal",17,4,"Liquid",265.8,332.0,3.103,"Antoine Jérôme Balard",null,17,4,"Bromine (from Ancient Greek:βρῶμος, brómos, meaning \"stench\") is a chemical element with symbol Br, and atomic number 35. It is a halogen. The element was isolated independently by two chemists, Carl Jacob Löwig and Antoine Jerome Balard, in 1825–1826."],[36,"Kr","Krypton",83.798,"noble gas",18,4,"Gas",115.78,119.93,0.004,"William Ramsay",null,18,4,"Krypton (from Greek:κρυπτός kryptos \"the hidden one\") is a chemical element with symbol Kr and atomic number 36. It is a member of group 18 (noble gases) elements."],[37,"Rb","Rubidium",85.468,"alkali metal",1,5,"Solid",312.45,961.0,1.532,"Robert Bunsen",null,1,5,"Rubidium is a chemical element with symbol Rb and atomic number 37. Rubidium is a soft, silvery-white metallic element of the alkali metal group, with an atomic mass of 85.4678. Elemental rubidium is highly reactive, with properties similar to those of other alkali metals, such as very rapid oxidation in air."],[38,"Sr","Strontium",87.621,"alkaline earth metal",2,5,"Solid",1050.0,1650.0,2.64,"William Cruickshank (chemist)",null,2,5,"Strontium is a chemical element with symbol Sr and atomic number 38. An alkaline earth metal, strontium is a soft silver-white or yellowish metallic element that is highly reactive chemically. The metal turns yellow when it is exposed to air."],[39,"Y","Yttrium",88.906,"transition metal",3,5,"Solid",1799.0,3203.0,4.472,"Johan Gadolin",null,3,5,"Yttrium is a chemical element with symbol Y and atomic number 39. It is a silvery-metallic transition metal chemically similar to the lanthanides and it has often been classified as a \"rare earth element\". Yttrium is almost always found combined with the lanthanides in rare earth minerals and is never found in nature as a free element."],[40,"Zr","Zirconium",91.224,"transition metal",4,5,"Solid",2128.0,4650.0,6.52,"Martin Heinrich Klaproth",null,4,5,"Zirconium is a chemical element with symbol Zr and atomic number 40. The name of zirconium is taken from the name of the mineral zircon, the most important source of zirconium. The word zircon comes from the Persian word zargun زرگون, meaning \"gold-colored\"."],[41,"Nb","Niobium",92.906,"transition metal",5,5,"Solid",2750.0,5017.0,8.57,"Charles Hatchett",null,5,5,"Niobium, formerly columbium, is a chemical element with symbol Nb (formerly Cb) and atomic number 41. It is a soft, grey, ductile transition metal, which is often found in the pyrochlore mineral, the main commercial source for niobium, and columbite."],[42,"Mo","Molybdenum",95.951,"transition metal",6,5,"Solid",2896.0,4912.0,10.28,"Carl Wilhelm Scheele",null,6,5,"Molybdenum is a chemical element with symbol Mo and atomic number 42. The name is from Neo-Latin molybdaenum, from Ancient Greek Μόλυβδος molybdos, meaning lead, since its ores were confused with lead ores."],[43,"Tc","Technetium",98.0,"transition metal",7,5,"Solid",2430.0,4538.0,11.0,"Emilio Segrè",null,7,5,"Technetium (/tɛkˈniːʃiəm/) is a chemical element with symbol Tc and atomic number 43. It is the element with the lowest atomic number in the periodic table that has no stable isotopes:every form of it is radioactive. Nearly all technetium is produced synthetically, and only minute amounts are found in nature."],[44,"Ru","Ruthenium",101.072,"transition metal",8,5,"Solid",2607.0,4423.0,12.45,"Karl Ernst Claus",null,8,5,"Ruthenium is a chemical element with symbol Ru and atomic number 44. It is a rare transition metal belonging to the platinum group of the periodic table. Like the other metals of the platinum group, ruthenium is inert to most other chemicals."],[45,"Rh","Rhodium",102.906,"transition metal",9,5,"Solid",2237.0,3968.0,12.41,"William Hyde Wollaston",null,9,5,"Rhodium is a chemical element with symbol Rh and atomic number 45. It is a rare, silvery-white, hard, and chemically inert transition metal. It is a member of the platinum group."],[46,"Pd","Palladium",106.421,"transition metal",10,5,"Solid",1828.05,3236.0,12.023,"William Hyde Wollaston",null,10,5,"Palladium is a chemical element with symbol Pd and atomic number 46. It is a rare and lustrous silvery-white metal discovered in 1803 by William Hyde Wollaston. He named it after the asteroid Pallas, which was itself named after the epithet of the Greek goddess Athena, acquired by her when she slew Pallas."],[47,"Ag","Silver",107.868,"transition metal",11,5,"Solid",1234.93,2435.0,10.49,"unknown, before 5000 BC",null,11,5,"Silver is a chemical element with symbol Ag (Greek:άργυρος árguros, Latin:argentum, both from the Indo-European root *h₂erǵ- for \"grey\" or \"shining\") and atomic number 47. A soft, white, lustrous transition metal, it possesses the highest electrical conductivity, thermal conductivity and reflectivity of any metal."],[48,"Cd","Cadmium",112.414,"transition metal",12,5,"Solid",594.22,1040.0,8.65,"Karl Samuel Leberecht Hermann","Isotopes of cadmium",12,5,"Cadmium is a chemical element with symbol Cd and atomic number 48. This soft, bluish-white metal is chemically similar to the two other stable metals in group 12, zinc and mercury. Like zinc, it prefers oxidation state +2 in most of its compounds and like mercury it shows a low melting point compared to transition metals."],[49,"In","Indium",114.818,"post-transition metal",13,5,"Solid",429.748,2345.0,7.31,"Ferdinand Reich",null,13,5,"Indium is a chemical element with symbol In and atomic number 49. It is a post-transition metallic element that is rare in Earth's crust. The metal is very soft, malleable and easily fusible, with a melting point higher than sodium, but lower than lithium or tin."],[50,"Sn","Tin",118.711,"post-transition metal",14,5,"Solid",505.08,2875.0,7.365,"unknown, before 3500 BC",null,14,5,"Tin is a chemical element with the symbol Sn (for Latin:stannum) and atomic number 50. It is a main group metal in group 14 of the periodic table. Tin shows a chemical similarity to both neighboring group-14 elements, germanium and lead, and has two possible oxidation states, +2 and the slightly more stable +4."],[51,"Sb","Antimony",121.76,"metalloid",15,5,"Solid",903.78,1908.0,6.697,"unknown, before 3000 BC",null,15,5,"Antimony is a chemical element with symbol Sb (from Latin:stibium) and atomic number 51. A lustrous gray metalloid, it is found in nature mainly as the sulfide mineral stibnite (Sb2S3)."],[52,"Te","Tellurium",127.603,"metalloid",16,5,"Solid",722.66,1261.0,6.24,"Franz-Joseph Müller von Reichenstein",null,16,5,"Tellurium is a chemical element with symbol Te and atomic number 52. It is a brittle, mildly toxic, rare, silver-white metalloid. Tellurium is chemically related to selenium and sulfur."],[53,"I","Iodine",126.904,"diatomic nonmetal",17,5,"Solid",386.85,457.4,4.933,"Bernard Courtois",null,17,5,"Iodine is a chemical element with symbol I and atomic number 53. The name is from Greek ἰοειδής ioeidēs, meaning violet or purple, due to the color of iodine vapor. Iodine and its compounds are primarily used in nutrition, and industrially in the production of acetic acid and certain polymers."],[54,"Xe","Xenon",131.294,"noble gas",18,5,"Gas",161.4,165.051,0.006,"William Ramsay",null,18,5,"Xenon is a chemical element with symbol Xe and atomic number 54. It is a colorless, dense, odorless noble gas, that occurs in the Earth's atmosphere in trace amounts. Although generally unreactive, xenon can undergo a few chemical reactions such as the formation of xenon hexafluoroplatinate, the first noble gas compound to be synthesized."],[55,"Cs","Cesium",132.905,"alkali metal",1,6,"Solid",301.7,944.0,1.93,"Robert Bunsen",null,1,6,"Caesium or cesium is a chemical element with symbol Cs and atomic number 55. It is a soft, silvery-gold alkali metal with a melting point of 28 °C (82 °F), which makes it one of only five elemental metals that are liquid at or near room temperature."],[56,"Ba","Barium",137.328,"alkaline earth metal",2,6,"Solid",1000.0,2118.0,3.51,"Carl Wilhelm Scheele",null,2,6,"Barium is a chemical element with symbol Ba and atomic number 56. It is the fifth element in Group 2, a soft silvery metallic alkaline earth metal. Because of its high chemical reactivity barium is never found in nature as a free element."],[57,"La","Lanthanum",138.905,"lanthanide",3,6,"Solid",1193.0,3737.0,6.162,"Carl Gustaf Mosander",null,3,9,"Lanthanum is a soft, ductile, silvery-white metallic chemical element with symbol La and atomic number 57. It tarnishes rapidly when exposed to air and is soft enough to be cut with a knife."],[58,"Ce","Cerium",140.116,"lanthanide",3,6,"Solid",1068.0,3716.0,6.77,"Martin Heinrich Klaproth",null,4,9,"Cerium is a chemical element with symbol Ce and atomic number 58. It is a soft, silvery, ductile metal which easily oxidizes in air. Cerium was named after the dwarf planet Ceres (itself named after the Roman goddess of agriculture)."],[59,"Pr","Praseodymium",140.908,"lanthanide",3,6,"Solid",1208.0,3403.0,6.77,"Carl Auer von Welsbach",null,5,9,"Praseodymium is a chemical element with symbol Pr and atomic number 59. Praseodymium is a soft, silvery, malleable and ductile metal in the lanthanide group. It is valued for its magnetic, electrical, chemical, and optical properties."],[60,"Nd","Neodymium",144.242,"lanthanide",3,6,"Solid",1297.0,3347.0,7.01,"Carl Auer von Welsbach",null,6,9,"Neodymium is a chemical element with symbol Nd and atomic number 60. It is a soft silvery metal that tarnishes in air. Neodymium was discovered in 1885 by the Austrian chemist Carl Auer von Welsbach."],[61,"Pm","Promethium",145.0,"lanthanide",3,6,"Solid",1315.0,3273.0,7.26,"Chien Shiung Wu","Isotopes of promethium",7,9,"Promethium, originally prometheum, is a chemical element with the symbol Pm and atomic number 61. All of its isotopes are radioactive; it is one of only two such elements that are followed in the periodic table by elements with stable forms, a distinction shared with technetium."],[62,"Sm","Samarium",150.362,"lanthanide",3,6,"Solid",1345.0,2173.0,7.52,"Lecoq de Boisbaudran",null,8,9,"Samarium is a chemical element with symbol Sm and atomic number 62. It is a moderately hard silvery metal that readily oxidizes in air. Being a typical member of the lanthanide series, samarium usually assumes the oxidation state +3."],[63,"Eu","Europium",151.964,"lanthanide",3,6,"Solid",1099.0,1802.0,5.264,"Eugène-Anatole Demarçay",null,9,9,"Europium is a chemical element with symbol Eu and atomic number 63. It was isolated in 1901 and is named after the continent of Europe. It is a moderately hard, silvery metal which readily oxidizes in air and water."],[64,"Gd","Gadolinium",157.253,"lanthanide",3,6,"Solid",1585.0,3273.0,7.9,"Jean Charles Galissard de Marignac",null,10,9,"Gadolinium is a chemical element with symbol Gd and atomic number 64. It is a silvery-white, malleable and ductile rare-earth metal. It is found in nature only in combined (salt) form."],[65,"Tb","Terbium",158.925,"lanthanide",3,6,"Solid",1629.0,3396.0,8.23,"Carl Gustaf Mosander",null,11,9,"Terbium is a chemical element with symbol Tb and atomic number 65. It is a silvery-white rare earth metal that is malleable, ductile and soft enough to be cut with a knife. Terbium is never found in nature as a free element, but it is contained in many minerals, including cerite, gadolinite, monazite, xenotime and euxenite."],[66,"Dy","Dysprosium",162.5,"lanthanide",3,6,"Solid",1680.0,2840.0,8.54,"Lecoq de Boisbaudran",null,12,9,"Dysprosium is a chemical element with the symbol Dy and atomic number 66. It is a rare earth element with a metallic silver luster. Dysprosium is never found in nature as a free element, though it is found in various minerals, such as xenotime."],[67,"Ho","Holmium",164.93,"lanthanide",3,6,"Solid",1734.0,2873.0,8.79,"Marc Delafontaine",null,13,9,"Holmium is a chemical element with symbol Ho and atomic number 67. Part of the lanthanide series, holmium is a rare earth element. Holmium was discovered by Swedish chemist Per Theodor Cleve."],[68,"Er","Erbium",167.259,"lanthanide",3,6,"Solid",1802.0,3141.0,9.066,"Carl Gustaf Mosander",null,14,9,"Erbium is a chemical element in the lanthanide series, with symbol Er and atomic number 68. A silvery-white solid metal when artificially isolated, natural erbium is always found in chemical combination with other elements on Earth."],[69,"Tm","Thulium",168.934,"lanthanide",3,6,"Solid",1818.0,2223.0,9.32,"Per Teodor Cleve",null,15,9,"Thulium is a chemical element with symbol Tm and atomic number 69. It is the thirteenth and antepenultimate (third-last) element in the lanthanide series. Like the other lanthanides, the most common oxidation state is +3, seen in its oxide, halides and other compounds."],[70,"Yb","Ytterbium",173.045,"lanthanide",3,6,"Solid",1097.0,1469.0,6.9,"Jean Charles Galissard de Marignac",null,16,9,"Ytterbium is a chemical element with symbol Yb and atomic number 70. It is the fourteenth and penultimate element in the lanthanide series, which is the basis of the relative stability of its +2 oxidation state. However, like the other lanthanides, its most common oxidation state is +3, seen in its oxide, halides and other compounds."],[71,"Lu","Lutetium",174.967,"lanthanide",3,6,"Solid",1925.0,3675.0,9.841,"Georges Urbain",null,17,9,"Lutetium is a chemical element with symbol Lu and atomic number 71. It is a silvery white metal, which resists corrosion in dry, but not in moist air. It is considered the first element of the 6th-period transition metals and the last element in the lanthanide series, and is traditionally counted among the rare earths."],[72,"Hf","Hafnium",178.492,"transition metal",4,6,"Solid",2506.0,4876.0,13.31,"Dirk Coster",null,4,6,"Hafnium is a chemical element with symbol Hf and atomic number 72. A lustrous, silvery gray, tetravalent transition metal, hafnium chemically resembles zirconium and is found in zirconium minerals."],[73,"Ta","Tantalum",180.948,"transition metal",5,6,"Solid",3290.0,5731.0,16.69,"Anders Gustaf Ekeberg",null,5,6,"Tantalum is a chemical element with symbol Ta and atomic number 73. Previously known as tantalium, its name comes from Tantalus, an antihero from Greek mythology. Tantalum is a rare, hard, blue-gray, lustrous transition metal that is highly corrosion-resistant."],[74,"W","Tungsten",183.841,"transition metal",6,6,"Solid",3695.0,6203.0,19.25,"Carl Wilhelm Scheele",null,6,6,"Tungsten, also known as wolfram, is a chemical element with symbol W and atomic number 74. The word tungsten comes from the Swedish language tung sten, which directly translates to heavy stone. Its name in Swedish is volfram, however, in order to distinguish it from scheelite, which in Swedish is alternatively named tungsten."],[75,"Re","Rhenium",186.207,"transition metal",7,6,"Solid",3459.0,5869.0,21.02,"Masataka Ogawa","Walter Noddack",7,6,"Rhenium is a chemical element with symbol Re and atomic number 75. It is a silvery-white, heavy, third-row transition metal in group 7 of the periodic table. With an estimated average concentration of 1 part per billion (ppb), rhenium is one of the rarest elements in the Earth's crust."],[76,"Os","Osmium",190.233,"transition metal",8,6,"Solid",3306.0,5285.0,22.59,"Smithson Tennant",null,8,6,"Osmium (from Greek osme (ὀσμή) meaning \"smell\") is a chemical element with symbol Os and atomic number 76. It is a hard, brittle, bluish-white transition metal in the platinum group that is found as a trace element in alloys, mostly in platinum ores. Osmium is the densest naturally occurring element, with a density of 22.59 g/cm3."],[77,"Ir","Iridium",192.217,"transition metal",9,6,"Solid",2719.0,4403.0,22.56,"Smithson Tennant",null,9,6,"Iridium is a chemical element with symbol Ir and atomic number 77."],[78,"Pt","Platinum",195.085,"transition metal",10,6,"Solid",2041.4,4098.0,21.45,"Antonio de Ulloa",null,10,6,"Platinum is a chemical element with symbol Pt and atomic number 78. It is a dense, malleable, ductile, highly unreactive, precious, gray-white transition metal. Its name is derived from the Spanish term platina, which is literally translated into \"little silver\"."],[79,"Au","Gold",196.967,"transition metal",11,6,"Solid",1337.33,3243.0,19.3,"Middle East",null,11,6,"Gold is a chemical element with symbol Au (from Latin:aurum) and atomic number 79. In its purest form, it is a bright, slightly reddish yellow, dense, soft, malleable and ductile metal. Chemically, gold is a transition metal and a group 11 element."],[80,"Hg","Mercury",200.592,"transition metal",12,6,"Liquid",234.321,629.88,13.534,"unknown, before 2000 BCE",null,12,6,"Mercury is a chemical element with symbol Hg and atomic number 80. It is commonly known as quicksilver and was formerly named hydrargyrum (/haɪˈdrɑːrdʒərəm/)."],[81,"Tl","Thallium",204.38,"post-transition metal",13,6,"Solid",577.0,1746.0,11.85,"William Crookes",null,13,6,"Thallium is a chemical element with symbol Tl and atomic number 81. This soft gray post-transition metal is not found free in nature. When isolated, it resembles tin, but discolors when exposed to air."],[82,"Pb","Lead",207.21,"post-transition metal",14,6,"Solid",600.61,2022.0,11.34,"Middle East",null,14,6,"Lead (/lɛd/) is a chemical element in the carbon group with symbol Pb (from Latin:plumbum) and atomic number 82. Lead is a soft, malleable and heavy post-transition metal. Metallic lead has a bluish-white color after being freshly cut, but it soon tarnishes to a dull grayish color when exposed to air."],[83,"Bi","Bismuth",208.98,"post-transition metal",15,6,"Solid",544.7,1837.0,9.78,"Claude François Geoffroy",null,15,6,"Bismuth is a chemical element with symbol Bi and atomic number 83. Bismuth, a pentavalent post-transition metal, chemically resembles arsenic and antimony. Elemental bismuth may occur naturally, although its sulfide and oxide form important commercial ores."],[84,"Po","Polonium",209.0,"post-transition metal",16,6,"Solid",527.0,1235.0,9.196,"Pierre Curie",null,16,6,"Polonium is a chemical element with symbol Po and atomic number 84, discovered in 1898 by Marie Curie and Pierre Curie. A rare and highly radioactive element with no stable isotopes, polonium is chemically similar to bismuth and tellurium, and it occurs in uranium ores. Applications of polonium are few."],[85,"At","Astatine",210.0,"metalloid",17,6,"Solid",575.0,610.0,6.35,"Dale R. Corson",null,17,6,"Astatine is a very rare radioactive chemical element with the chemical symbol At and atomic number 85. It occurs on Earth as the decay product of various heavier elements. All its isotopes are short-lived; the most stable is astatine-210, with a half-life of 8.1 hours."],[86,"Rn","Radon",222.0,"noble gas",18,6,"Gas",202.0,211.5,0.01,"Friedrich Ernst Dorn",null,18,6,"Radon is a chemical element with symbol Rn and atomic number 86. It is a radioactive, colorless, odorless, tasteless noble gas, occurring naturally as a decay product of radium. Its most stable isotope, 222Rn, has a half-life of 3.8 days."],[87,"Fr","Francium",223.0,"alkali metal",1,7,"Solid",300.0,950.0,1.87,"Marguerite Perey",null,1,7,"Francium is a chemical element with symbol Fr and atomic number 87. It used to be known as eka-caesium and actinium K. It is the second-least electronegative element, behind only caesium. Francium is a highly radioactive metal that decays into astatine, radium, and radon."],[88,"Ra","Radium",226.0,"alkaline earth metal",2,7,"Solid",1233.0,2010.0,5.5,"Pierre Curie",null,2,7,"Radium is a chemical element with symbol Ra and atomic number 88. It is the sixth element in group 2 of the periodic table, also known as the alkaline earth metals. Pure radium is almost colorless, but it readily combines with nitrogen (rather than oxygen) on exposure to air, forming a black surface layer of radium nitride (Ra3N2)."],[89,"Ac","Actinium",227.0,"actinide",3,7,"Solid",1500.0,3500.0,10.0,"Friedrich Oskar Giesel",null,3,10,"Actinium is a radioactive chemical element with symbol Ac (not to be confused with the abbreviation for an acetyl group) and atomic number 89, which was discovered in 1899. It was the first non-primordial radioactive element to be isolated. Polonium, radium and radon were observed before actinium, but they were not isolated until 1902."],[90,"Th","Thorium",232.038,"actinide",3,7,"Solid",2023.0,5061.0,11.724,"Jöns Jakob Berzelius",null,4,10,"Thorium is a chemical element with symbol Th and atomic number 90. A radioactive actinide metal, thorium is one of only two significantly radioactive elements that still occur naturally in large quantities as a primordial element (the other being uranium)."],[91,"Pa","Protactinium",231.036,"actinide",3,7,"Solid",1841.0,4300.0,15.37,"William Crookes","Otto Hahn",5,10,"Protactinium is a chemical element with symbol Pa and atomic number 91. It is a dense, silvery-gray metal which readily reacts with oxygen, water vapor and inorganic acids. It forms various chemical compounds where protactinium is usually present in the oxidation state +5, but can also assume +4 and even +2 or +3 states."],[92,"U","Uranium",238.029,"actinide",3,7,"Solid",1405.3,4404.0,19.1,"Martin Heinrich Klaproth",null,6,10,"Uranium is a chemical element with symbol U and atomic number 92. It is a silvery-white metal in the actinide series of the periodic table. A uranium atom has 92 protons and 92 electrons, of which 6 are valence electrons."],[93,"Np","Neptunium",237.0,"actinide",3,7,"Solid",912.0,4447.0,20.45,"Edwin McMillan",null,7,10,"Neptunium is a chemical element with symbol Np and atomic number 93. A radioactive actinide metal, neptunium is the first transuranic element. Its position in the periodic table just after uranium, named after the planet Uranus, led to it being named after Neptune, the next planet beyond Uranus."],[94,"Pu","Plutonium",244.0,"actinide",3,7,"Solid",912.5,3505.0,19.816,"Glenn T. Seaborg",null,8,10,"Plutonium is a transuranic radioactive chemical element with symbol Pu and atomic number 94. It is an actinide metal of silvery-gray appearance that tarnishes when exposed to air, and forms a dull coating when oxidized. The element normally exhibits six allotropes and four oxidation states."],[95,"Am","Americium",243.0,"actinide",3,7,"Solid",1449.0,2880.0,12.0,"Glenn T. Seaborg",null,9,10,"Americium is a radioactive transuranic chemical element with symbol Am and atomic number 95. This member of the actinide series is located in the periodic table under the lanthanide element europium, and thus by analogy was named after the Americas."],[96,"Cm","Curium",247.0,"actinide",3,7,"Solid",1613.0,3383.0,13.51,"Glenn T. Seaborg",null,10,10,"Curium is a transuranic radioactive chemical element with symbol Cm and atomic number 96. This element of the actinide series was named after Marie and Pierre Curie – both were known for their research on radioactivity. Curium was first intentionally produced and identified in July 1944 by the group of Glenn T."],[97,"Bk","Berkelium",247.0,"actinide",3,7,"Solid",1259.0,2900.0,14.78,"Lawrence Berkeley National Laboratory",null,11,10,"Berkelium is a transuranic radioactive chemical element with symbol Bk and atomic number 97. It is a member of the actinide and transuranium element series. It is named after the city of Berkeley, California, the location of the University of California Radiation Laboratory where it was discovered in December 1949."],[98,"Cf","Californium",251.0,"actinide",3,7,"Solid",1173.0,1743.0,15.1,"Lawrence Berkeley National Laboratory",null,12,10,"Californium is a radioactive metallic chemical element with symbol Cf and atomic number 98. The element was first made in 1950 at the University of California Radiation Laboratory in Berkeley, by bombarding curium with alpha particles (helium-4 ions)."],[99,"Es","Einsteinium",252.0,"actinide",3,7,"Solid",1133.0,1269.0,8.84,"Lawrence Berkeley National Laboratory",null,13,10,"Einsteinium is a synthetic element with symbol Es and atomic number 99. It is the seventh transuranic element, and an actinide. Einsteinium was discovered as a component of the debris of the first hydrogen bomb explosion in 1952, and named after Albert Einstein."],[100,"Fm","Fermium",257.0,"actinide",3,7,"Solid",1800.0,null,null,"Lawrence Berkeley National Laboratory",null,14,10,"Fermium is a synthetic element with symbol Fm and atomic number 100. It is a member of the actinide series. It is the heaviest element that can be formed by neutron bombardment of lighter elements, and hence the last element that can be prepared in macroscopic quantities, although pure fermium metal has not yet been prepared."],[101,"Md","Mendelevium",258.0,"actinide",3,7,"Solid",1100.0,null,null,"Lawrence Berkeley National Laboratory",null,15,10,"Mendelevium is a synthetic element with chemical symbol Md (formerly Mv) and atomic number 101. A metallic radioactive transuranic element in the actinide series, it is the first element that currently cannot be produced in macroscopic quantities through neutron bombardment of lighter elements."],[102,"No","Nobelium",259.0,"actinide",3,7,"Solid",1100.0,null,null,"Joint Institute for Nuclear Research",null,16,10,"Nobelium is a synthetic chemical element with symbol No and atomic number 102. It is named in honor of Alfred Nobel, the inventor of dynamite and benefactor of science. A radioactive metal, it is the tenth transuranic element and is the penultimate member of the actinide series."],[103,"Lr","Lawrencium",266.0,"actinide",3,7,"Solid",1900.0,null,null,"Lawrence Berkeley National Laboratory",null,17,10,"Lawrencium is a synthetic chemical element with chemical symbol Lr (formerly Lw) and atomic number 103. It is named in honor of Ernest Lawrence, inventor of the cyclotron, a device that was used to discover many artificial radioactive elements."],[104,"Rf","Rutherfordium",267.0,"transition metal",4,7,"Solid",2400.0,5800.0,23.2,"Joint Institute for Nuclear Research",null,4,7,"Rutherfordium is a chemical element with symbol Rf and atomic number 104, named in honor of physicist Ernest Rutherford. It is a synthetic element (an element that can be created in a laboratory but is not found in nature) and radioactive; the most stable known isotope, 267Rf, has a half-life of approximately 1.3 hours."],[105,"Db","Dubnium",268.0,"transition metal",5,7,"Solid",null,null,29.3,"Joint Institute for Nuclear Research",null,5,7,"Dubnium is a chemical element with symbol Db and atomic number 105. It is named after the town of Dubna in Russia (north of Moscow), where it was first produced."],[106,"Sg","Seaborgium",269.0,"transition metal",6,7,"Solid",null,null,35.0,"Lawrence Berkeley National Laboratory",null,6,7,"Seaborgium is a synthetic element with symbol Sg and atomic number 106. Its most stable isotope 271Sg has a half-life of 1.9 minutes. A more recently discovered isotope 269Sg has a potentially slightly longer half-life (ca."],[107,"Bh","Bohrium",270.0,"transition metal",7,7,"Solid",null,null,37.1,"Gesellschaft für Schwerionenforschung",null,7,7,"Bohrium is a chemical element with symbol Bh and atomic number 107. It is named after Danish physicist Niels Bohr. It is a synthetic element (an element that can be created in a laboratory but is not found in nature) and radioactive; the most stable known isotope, 270Bh, has a half-life of approximately 61 seconds."],[108,"Hs","Hassium",269.0,"transition metal",8,7,"Solid",null,null,40.7,"Gesellschaft für Schwerionenforschung",null,8,7,"Hassium is a chemical element with symbol Hs and atomic number 108, named after the German state of Hesse."],[109,"Mt","Meitnerium",278.0,"unknown transition metal",9,7,"Solid",null,null,37.4,"Gesellschaft für Schwerionenforschung",null,9,7,"Meitnerium is a chemical element with symbol Mt and atomic number 109. It is an extremely radioactive synthetic element (an element not found in nature that can be created in a laboratory). The most stable known isotope, meitnerium-278, has a half-life of 7.6 seconds."],[110,"Ds","Darmstadtium",281.0,"unknown transition metal",10,7,"Solid",null,null,34.8,"Gesellschaft für Schwerionenforschung",null,10,7,"Darmstadtium is a chemical element with symbol Ds and atomic number 110. It is an extremely radioactive synthetic element. The most stable known isotope, darmstadtium-281, has a half-life of approximately 10 seconds."],[111,"Rg","Roentgenium",282.0,"unknown transition metal",11,7,"Solid",null,null,28.7,"Gesellschaft für Schwerionenforschung",null,11,7,"Roentgenium is a chemical element with symbol Rg and atomic number 111. It is an extremely radioactive synthetic element (an element that can be created in a laboratory but is not found in nature); the most stable known isotope, roentgenium-282, has a half-life of 2.1 minutes."],[112,"Cn","Copernicium",285.0,"transition metal",12,7,"Liquid",283.0,340.0,14.0,"Gesellschaft für Schwerionenforschung",null,12,7,"Copernicium is a chemical element with symbol Cn and atomic number 112. It is an extremely radioactive synthetic element that can only be created in a laboratory."],[113,"Nh","Nihonium",286.0,"unknown transition metal",13,7,"Solid",700.0,1430.0,16.0,"RIKEN",null,13,7,"Nihonium is a chemical element with atomic number 113. It has a symbol Nh. It is a synthetic element (an element that can be created in a laboratory but is not found in nature) and is extremely radioactive; its most stable known isotope, nihonium-286, has a half-life of 20 seconds."],[114,"Fl","Flerovium",289.0,"post-transition metal",14,7,"Solid",340.0,420.0,14.0,"Joint Institute for Nuclear Research",null,14,7,"Flerovium is a superheavy artificial chemical element with symbol Fl and atomic number 114. It is an extremely radioactive synthetic element. The element is named after the Flerov Laboratory of Nuclear Reactions of the Joint Institute for Nuclear Research in Dubna, Russia, where the element was discovered in 1998."],[115,"Mc","Moscovium",289.0,"unknown post-transition metal",15,7,"Solid",670.0,1400.0,13.5,"Joint Institute for Nuclear Research",null,15,7,"Moscovium is the name of a synthetic superheavy element in the periodic table that has the symbol Mc and has the atomic number 115. It is an extremely radioactive element; its most stable known isotope, moscovium-289, has a half-life of only 220 milliseconds. It is also known as eka-bismuth or simply element 115."],[116,"Lv","Livermorium",293.0,"unknown post-transition metal",16,7,"Solid",709.0,1085.0,12.9,"Joint Institute for Nuclear Research",null,16,7,"Livermorium is a synthetic superheavy element with symbol Lv and atomic number 116. It is an extremely radioactive element that has only been created in the laboratory and has not been observed in nature."],[117,"Ts","Tennessine",294.0,"unknown metalloid",17,7,"Solid",723.0,883.0,7.17,"Joint Institute for Nuclear Research",null,17,7,"Tennessine is a superheavy artificial chemical element with an atomic number of 117 and a symbol of Ts. Also known as eka-astatine or element 117, it is the second-heaviest known element and penultimate element of the 7th period of the periodic table."],[118,"Og","Oganesson",294.0,"unknown, predicted to be noble gas",18,7,"Solid",null,350.0,4.95,"Joint Institute for Nuclear Research",null,18,7,"Oganesson is IUPAC's name for the transactinide element with the atomic number 118 and element symbol Og. It is also known as eka-radon or element 118, and on the periodic table of the elements it is a p-block element and the last one of the 7th period. Oganesson is currently the only synthetic member of group 18."]];

{id:'nano3',n:'Chile saltpetre',f:'NaNO\u2083',use:'is a nitrogen fertiliser mined in Chile',k:'salt',ch:1,ing:{Na:1,N:1,O:3},c:'#fbf7ee',fact:'Sodium nitrate, mined in Chile, was an important nitrogen fertiliser before the Haber-Bosch process.',s:'brit'},
{id:'casio3',n:'Wollastonite',f:'CaSiO\u2083',use:'goes into ceramics and tiles',k:'mineral',ch:3,ing:{Ca:1,Si:1,O:3},c:'#f6efe2',fact:'Calcium silicate minerals such as wollastonite are used in ceramics.',s:'brit'},
{id:'na2sio3',n:'Water glass',f:'Na\u2082SiO\u2083',use:'was used to keep eggs fresh',k:'salt',ch:2,ing:{Na:2,Si:1,O:3},c:'#e6f4ff',fact:'Sodium silicate, called water glass, was once used to preserve eggs.',s:'brit'},
{id:'mgco3',n:'Climbers\' chalk',f:'MgCO\u2083',use:'keeps climbers\' hands dry',k:'salt',ch:3,ing:{Mg:1,C:1,O:3},c:'#ffffff',fact:'Magnesium carbonate is the white chalk powder that climbers and gymnasts use for grip.',s:'pub'},
{id:'feco3',n:'Siderite',f:'FeCO\u2083',use:'is a brown iron ore',k:'mineral',ch:3,ing:{Fe:1,C:1,O:3},c:'#b58b5a',fact:'Siderite is an iron carbonate mineral that has been mined as iron ore.',s:'brit'},
{id:'k2co3',n:'Potash',f:'K\u2082CO\u2083',use:'was boiled from wood ash in pots',k:'salt',ch:1,ing:{K:2,C:1,O:3},c:'#f7f5f0',fact:'Potash gets its name from wood ash soaked and boiled in pots. It is used in soap and glass.',s:'brit'},
{id:'na3po4',n:'Phosphate cleaner',f:'Na\u2083PO\u2084',use:'is found in strong household cleaners',k:'salt',ch:1,ing:{Na:3,P:1,O:4},c:'#f0f6ff',fact:'Trisodium phosphate is used in cleaning products.',s:'pub'},
{id:'p2o5',n:'Drying powder',f:'P\u2082O\u2085',use:'is a very thirsty drying agent',k:'oxide',ch:2,ing:{P:2,O:5},c:'#ffffff',fact:'Phosphorus pentoxide is one of the most powerful drying agents and is the parent of phosphoric acid.',s:'pub'},
{id:'no',n:'Nitric oxide',f:'NO',use:'is a signal your blood vessels use to relax',k:'gas',ch:0,ing:{N:1,O:1},c:'#c9d8ff',fact:'Nitric oxide is a signalling molecule in blood vessels. Its discovery won the 1998 Nobel Prize in Physiology or Medicine.',s:'nobel'},
{id:'n2',n:'Nitrogen gas',f:'N\u2082',use:'makes up most of the air',k:'gas',ch:0,ing:{N:2},c:'#bcd2ff',fact:'Nitrogen gas is about 78% of the air you breathe.',s:'rsc'},
{id:'o2',n:'Oxygen gas',f:'O\u2082',use:'is what you breathe in',k:'gas',ch:0,ing:{O:2},c:'#aee4ff',fact:'Oxygen gas is about 21% of air and is what animals use to release energy from food.',s:'rsc'},
{id:'h2',n:'Hydrogen gas',f:'H\u2082',use:'lifted the first gas balloons',k:'gas',ch:0,ing:{H:2},c:'#d8f0ff',fact:'Hydrogen is the lightest gas. The first hydrogen balloon flew in Paris in 1783.',s:'brit'},
{id:'aloh3',n:'Aluminium hydroxide',f:'Al(OH)\u2083',use:'is in some stomach medicines and water treatment',k:'base',ch:1,ing:{Al:1,O:3,H:3},c:'#f9fbff',fact:'Aluminium hydroxide is used in antacids and in water treatment.',s:'pub'},
{id:'cu2s',n:'Chalcocite',f:'Cu\u2082S',use:'is a dark grey copper ore',k:'mineral',ch:3,ing:{Cu:2,S:1},c:'#5d6678',fact:'Chalcocite is a copper sulfide mineral and an important copper ore.',s:'brit'},
{id:'electrum',n:'Electrum',f:'Au + Ag',use:'made some of the world\'s first coins',k:'alloy',ch:3,ing:{Au:1,Ag:1},c:'#f0d98a',fact:'Some of the first coins, from Lydia around 600 BCE, were made of electrum, a natural gold and silver alloy.',s:'brit'},
{id:'rosegold',n:'Rose gold',f:'Au + Cu',use:'gets its pink colour from copper',k:'alloy',ch:3,ing:{Au:3,Cu:1},c:'#f2b29a',fact:'Rose gold is gold mixed with copper, which gives it a pink tint.',s:'pub'},
{id:'stainless',n:'Stainless steel',f:'Fe + Cr',use:'shrugs off rust',k:'alloy',ch:3,ing:{Fe:7,Cr:1},c:'#cfd5e0',fact:'Stainless steel needs at least about 10.5% chromium to resist rust.',s:'brit'},
{id:'formic',n:'Formic acid',f:'CH\u2082O\u2082',use:'is named after ants',k:'acid',ch:5,ing:{C:1,H:2,O:2},c:'#ffd2c2',fact:'Formic acid is named from the Latin word for ant, formica. Ants make it.',s:'brit'},
{id:'mgf2',n:'Lens coating',f:'MgF\u2082',use:'makes camera lenses less shiny',k:'salt',ch:1,ing:{Mg:1,F:2},c:'#eef6ff',fact:'Magnesium fluoride is used as an anti-reflective coating on lenses.',s:'pub'},
{id:'na2s2o3',n:'Photo fixer',f:'Na\u2082S\u2082O\u2083',use:'was used to fix film photographs',k:'salt',ch:1,ing:{Na:2,S:2,O:3},c:'#f4fbff',fact:'Sodium thiosulfate was used as a fixer to make film photographs permanent.',s:'pub'},
{id:'na2o',n:'Soda glass oxide',f:'Na\u2082O',use:'is listed in the recipe for ordinary glass',k:'oxide',ch:2,ing:{Na:2,O:1},c:'#f1f3f9',fact:'Sodium oxide appears in the chemical recipe of ordinary soda-lime glass.',s:'brit'},
{id:'k2o',n:'Fertiliser K\u2082O',f:'K\u2082O',use:'is how fertiliser bags list potassium',k:'oxide',ch:2,ing:{K:2,O:1},c:'#f3eefb',fact:'Fertiliser labels state potassium content as potash, K\u2082O.',s:'pub'},
{id:'cuoh2',n:'Blue copper hydroxide',f:'Cu(OH)\u2082',use:'is a pale blue solid',k:'base',ch:3,ing:{Cu:1,O:2,H:2},c:'#6ab0ff',fact:'Copper hydroxide is a pale blue solid.',s:'pub'},
{id:'o3',n:'Ozone',f:'O\u2083',use:'shields life by absorbing the Sun\'s harmful ultraviolet light',k:'gas',ch:0,ing:{O:3},c:'#8fd8ff',fact:'Ozone high in the stratosphere absorbs most of the Sun\'s harmful ultraviolet light.',s:'nasa'},
{id:'c2h6',n:'Ethane',f:'C\u2082H\u2086',use:'is the second main gas in natural gas',k:'gas',ch:0,ing:{C:2,H:6},c:'#9fd0ff',fact:'Ethane is the second-largest part of natural gas, after methane.',s:'pub'},
{id:'c2h4',n:'Ethene',f:'C\u2082H\u2084',use:'is the plant hormone that ripens fruit',k:'gas',ch:5,ing:{C:2,H:4},c:'#b6ff9a',fact:'Ethylene (ethene) is a hormone plants release that makes fruit ripen. Growers use it to ripen bananas.',s:'brit'},
{id:'urea',n:'Urea',f:'CH\u2084N\u2082O',use:'is in fertiliser and is how the body clears extra nitrogen',k:'organic',ch:5,ing:{C:1,H:4,N:2,O:1},c:'#fff2c9',fact:'In 1828 Friedrich W\u00F6hler made urea from non-living ingredients, a landmark in organic chemistry.',s:'brit'},
{id:'acetic',n:'Acetic acid',f:'C\u2082H\u2084O\u2082',use:'is what gives vinegar its sour taste',k:'acid',ch:5,ing:{C:2,H:4,O:2},c:'#ffe8a8',fact:'Vinegar is typically about 5% acetic acid in water.',s:'pub'},
{id:'kcl',n:'Potassium chloride',f:'KCl',use:'goes into fertiliser and some salt substitutes',k:'salt',ch:1,ing:{K:1,Cl:1},c:'#f5f7ff',fact:'Potassium chloride is used in fertiliser and in some salt substitutes.',s:'pub'},
{id:'cacl2',n:'Calcium chloride',f:'CaCl\u2082',use:'is spread on icy roads',k:'salt',ch:1,ing:{Ca:1,Cl:2},c:'#f4f1e6',fact:'Spread on icy roads, calcium chloride lowers the freezing point of water.',s:'pub'},
{id:'naf',n:'Sodium fluoride',f:'NaF',use:'is the fluoride in some toothpastes',k:'salt',ch:1,ing:{Na:1,F:1},c:'#eef4ff',fact:'Fluoride compounds in toothpaste help harden tooth enamel.',s:'pub'},
{id:'ki',n:'Potassium iodide',f:'KI',use:'is added to some table salt to supply iodine',k:'salt',ch:1,ing:{K:1,I:1},c:'#f1e6ff',fact:'Potassium iodide is added to some table salt to supply the iodine your body needs for thyroid hormones.',s:'pub'},
{id:'caf2',n:'Fluorite',f:'CaF\u2082',use:'is the colourful mineral that gave "fluorescence" its name',k:'mineral',ch:3,ing:{Ca:1,F:2},c:'#b78bff',fact:'Some fluorite glows under ultraviolet light, which is where the word fluorescence comes from.',s:'brit'},
{id:'gypsum',n:'Gypsum',f:'CaSO\u2084',use:'is the soft white mineral in plaster and drywall',k:'mineral',ch:3,ing:{Ca:1,S:1,O:4},c:'#f6f2ea',fact:'Gypsum, in its hydrated form, is the main ingredient of plaster and drywall.',s:'brit'},
{id:'epsom',n:'Epsom salt',f:'MgSO\u2084',use:'is named after a spring in Epsom, England',k:'salt',ch:1,ing:{Mg:1,S:1,O:4},c:'#f2fbff',fact:'Epsom salt, magnesium sulfate, is named after the town of Epsom in England, where it was found in spring water.',s:'brit'},
{id:'washsoda',n:'Washing soda',f:'Na\u2082CO\u2083',use:'is a key ingredient in making glass',k:'salt',ch:1,ing:{Na:2,C:1,O:3},c:'#fafcff',fact:'Sodium carbonate is a key ingredient in glassmaking and a laundry cleaner.',s:'brit'},
{id:'kno3',n:'Saltpetre',f:'KNO\u2083',use:'is used in fertiliser and for curing meat',k:'salt',ch:1,ing:{K:1,N:1,O:3},c:'#f4f8ff',fact:'Potassium nitrate, known as saltpetre, is used in fertiliser and in food curing.',s:'brit'},
{id:'nh4cl',n:'Sal ammoniac',f:'NH\u2084Cl',use:'cleans metal before soldering',k:'salt',ch:1,ing:{N:1,H:4,Cl:1},c:'#fffaf0',fact:'Sal ammoniac has been known for centuries. Metalworkers use it to clean metal before soldering.',s:'sih'},
{id:'cuso4',n:'Blue vitriol',f:'CuSO\u2084',use:'forms bright blue crystals',k:'salt',ch:3,ing:{Cu:1,S:1,O:4},c:'#3a8cff',fact:'Hydrated copper sulfate forms bright blue crystals. Alchemists called it blue vitriol.',s:'pub'},
{id:'zno',n:'Zinc oxide',f:'ZnO',use:'is the white powder in sunscreen and creams',k:'oxide',ch:2,ing:{Zn:1,O:1},c:'#ffffff',fact:'Zinc oxide is used in sunscreen and skin creams.',s:'pub'},
{id:'tio2',n:'Titanium dioxide',f:'TiO\u2082',use:'is the brightest white in paint',k:'oxide',ch:2,ing:{Ti:1,O:2},c:'#fbfbff',fact:'Titanium dioxide is the most widely used white pigment.',s:'brit'},
{id:'magnetite',n:'Magnetite',f:'Fe\u2083O\u2084',use:'is the natural magnet stone',k:'mineral',ch:3,ing:{Fe:3,O:4},c:'#4a4f66',fact:'Magnetite is the most magnetic natural mineral. Lodestone is a naturally magnetised form of it.',s:'brit'},
{id:'sno2',n:'Tin oxide',f:'SnO\u2082',use:'is the main ore of tin',k:'oxide',ch:3,ing:{Sn:1,O:2},c:'#d9d6cc',fact:'Tin oxide occurs as the mineral cassiterite, the main ore of tin.',s:'brit'},
{id:'pbs',n:'Galena',f:'PbS',use:'is the shiny grey ore of lead',k:'mineral',ch:3,ing:{Pb:1,S:1},c:'#8c93a8',fact:'Galena is the main ore of lead and was used in early crystal radio sets.',s:'brit'},
{id:'cr2o3',n:'Chromium green',f:'Cr\u2082O\u2083',use:'is a green pigment for paint and ceramics',k:'oxide',ch:2,ing:{Cr:2,O:3},c:'#2fae5a',fact:'Chromium(III) oxide is a green pigment used in paints and ceramics.',s:'pub'},
{id:'koh',n:'Potash lye',f:'KOH',use:'makes soft soap',k:'base',ch:1,ing:{K:1,O:1,H:1},c:'#e9ecff',fact:'Potassium hydroxide, once made from wood-ash potash, makes soft soap.',s:'brit'},
{id:'h3po4',n:'Phosphoric acid',f:'H\u2083PO\u2084',use:'gives cola drinks a tangy bite',k:'acid',ch:1,ing:{H:3,P:1,O:4},c:'#ffe0b0',fact:'Phosphoric acid gives cola drinks a tangy bite and is also used in fertiliser.',s:'pub'},
{id:'sic',n:'Carborundum',f:'SiC',use:'is extremely hard and used on sandpaper',k:'mineral',ch:3,ing:{Si:1,C:1},c:'#5c6a8a',fact:'Silicon carbide is extremely hard and used in sandpaper and grinding wheels.',s:'brit'},
{id:'mgoh2',n:'Milk of magnesia',f:'Mg(OH)\u2082',use:'calms an upset stomach',k:'base',ch:1,ing:{Mg:1,O:2,H:2},c:'#fffefb',fact:'Milk of magnesia is magnesium hydroxide, which neutralises stomach acid.',s:'pub'},
{id:'pyrite',n:'Fool\'s gold',f:'FeS\u2082',use:'shines like gold but is not gold',k:'mineral',ch:3,ing:{Fe:1,S:2},c:'#f0d34a',fact:'Pyrite is called fool\'s gold because its brassy shine fools people.',s:'brit'},
{id:'ag2s',n:'Silver tarnish',f:'Ag\u2082S',use:'is the dark film on old silver',k:'salt',ch:3,ing:{Ag:2,S:1},c:'#4a4a52',fact:'Silver tarnish is silver sulfide, formed by sulfur compounds in the air.',s:'pub'},
{id:'fecl3',n:'Ferric chloride',f:'FeCl\u2083',use:'etches copper for circuit boards',k:'salt',ch:3,ing:{Fe:1,Cl:3},c:'#c27a2a',fact:'Ferric chloride is used to etch copper when making circuit boards.',s:'pub'},
{id:'baso4',n:'Barium meal',f:'BaSO\u2084',use:'shows up on X-rays of the gut',k:'salt',ch:3,ing:{Ba:1,S:1,O:4},c:'#f4f4f8',fact:'Barium sulfate is opaque to X-rays, so a barium drink lets doctors see the gut on a scan. It does not dissolve, which keeps it safe for that use.',s:'pub'},
{id:'water',n:'Water',f:'H\u2082O',al:'Aqua',use:'quenches thirst and puts out fires',k:'liquid',ch:0,ing:{H:2,O:1},c:'#3aa0ff',fact:'Water covers about 71% of the Earth\'s surface. One molecule is two hydrogen atoms joined to one oxygen.',s:'usgs'},
{id:'co2',n:'Carbon dioxide',f:'CO\u2082',use:'puts the bubbles in fizzy drinks',k:'gas',ch:0,ing:{C:1,O:2},c:'#9fb4d9',fact:'Dry ice is solid CO\u2082. It turns straight into gas at \u221278.5 \u00B0C.',s:'nist'},
{id:'h2o2',n:'Hydrogen peroxide',f:'H\u2082O\u2082',use:'bleaches hair and cleans small cuts (only at 3%)',k:'liquid',ch:0,ing:{H:2,O:2},c:'#bfe9ff',fact:'Pharmacy peroxide is about 3% in water. Much stronger solutions burn skin.',s:'pub'},
{id:'co',n:'Carbon monoxide',f:'CO',use:'is the gas a home CO alarm is built to detect',ask:'I am a safety inspector. Which gas does a home CO alarm detect?',k:'gas',ch:0,ing:{C:1,O:1},c:'#7a86a8',fact:'CO has no smell or colour, which is why homes need CO alarms.',s:'pub'},
{id:'nh3',n:'Ammonia',f:'NH\u2083',al:'Spirit of hartshorn',use:'makes glass cleaner sharp-smelling and feeds crops as fertiliser',k:'gas',ch:0,ing:{N:1,H:3},c:'#d2ffb0',fact:'The Haber-Bosch process (1909-1913) made ammonia from air and hydrogen and revolutionised fertilisers.',s:'brit'},
{id:'n2o',n:'Nitrous oxide',f:'N\u2082O',al:'Laughing gas',use:'was called laughing gas and is used in dentistry',ask:'Which gas did people once call laughing gas?',k:'gas',ch:0,ing:{N:2,O:1},c:'#ffd0f5',fact:'Humphry Davy described its effects in 1800 and nicknamed it laughing gas.',s:'sih'},
{id:'ch4',n:'Methane',f:'CH\u2084',use:'burns blue on a kitchen stove',k:'gas',ch:0,ing:{C:1,H:4},c:'#79c8ff',fact:'Methane is the main part of natural gas.',s:'pub'},
{id:'nacl',n:'Salt',f:'NaCl',al:'Salt of the sea',use:'seasons your food and keeps it from rotting',k:'salt',ch:1,ing:{Na:1,Cl:1},c:'#f4f7ff',fact:'Salt is sodium and chlorine joined. Two dangerous elements make a food you eat daily.',s:'pub'},
{id:'hcl',n:'Hydrochloric acid',f:'HCl',al:'Spirit of salt',use:'is the acid your stomach makes to digest food',k:'acid',ch:1,ing:{H:1,Cl:1},c:'#d8ff6b',fact:'Stomach acid is a weak hydrochloric acid solution with a pH of roughly 1.5 to 3.5.',s:'pub'},
{id:'naoh',n:'Sodium hydroxide',f:'NaOH',al:'Lye',use:'turns fat into soap',k:'base',ch:1,ing:{Na:1,O:1,H:1},c:'#e4e8ff',fact:'Lye reacts with fats in soap-making. It is strongly caustic and burns skin.',s:'pub'},
{id:'h2co3',n:'Carbonic acid',f:'H\u2082CO\u2083',use:'is the weak acid that makes fizzy water tingle',k:'acid',ch:1,ing:{water:1,co2:1},c:'#b8f0ff',fact:'CO\u2082 dissolved in water makes a little carbonic acid. That gives sparkling water its slight tang.',s:'pub'},
{id:'nahco3',n:'Baking soda',f:'NaHCO\u2083',use:'makes cakes rise and calms heartburn',k:'salt',ch:1,ing:{naoh:1,h2co3:1},byp:['water'],c:'#fffdf2',fact:'Baking soda (sodium bicarbonate) gives off CO\u2082 when heated or mixed with acid. That is what makes dough rise.',s:'pub'},
{id:'neut',p:'nacl',n:'Salt, the second way',f:'NaCl + H\u2082O',use:'comes from an acid and a base cancelling each other out',k:'salt',ch:1,ing:{hcl:1,naoh:1},byp:['water'],c:'#f4f7ff',fact:'Acid plus base gives salt plus water. Chemists call it neutralisation.',s:'brit'},
{id:'h2s',n:'Hydrogen sulfide',f:'H\u2082S',use:'gives hot springs and swamps their rotten-egg smell',ask:'I guide visitors around hot springs. Which gas gives them that rotten-egg smell?',k:'gas',ch:1,ing:{H:2,S:1},c:'#e8f26b',fact:'You can smell H\u2082S in tiny amounts, but it is toxic and numbs your sense of smell at high levels.',s:'pub'},
{id:'so2',n:'Sulfur dioxide',f:'SO\u2082',use:'keeps dried apricots fresh and puffs out of volcanoes',k:'gas',ch:1,ing:{S:1,O:2},c:'#ffe34d',fact:'SO\u2082 is used as a food preservative (E220) and is a main gas in volcanic eruptions.',s:'pub'},
{id:'so3',n:'Sulfur trioxide',f:'SO\u2083',use:'is the invisible step on the way to sulfuric acid',k:'gas',ch:1,ing:{S:1,O:3},c:'#ffc34d',fact:'SO\u2083 meets water and instantly becomes sulfuric acid.',s:'pub'},
{id:'h2so4',n:'Sulfuric acid',f:'H\u2082SO\u2084',al:'Oil of vitriol',use:'fills car batteries and is the most-made industrial chemical',k:'acid',ch:4,ing:{so3:1,water:1},c:'#ffe96b',fact:'Alchemists called it oil of vitriol. It is one of the most-produced chemicals in the world.',s:'brit'},
{id:'hno3',n:'Nitric acid',f:'HNO\u2083',al:'Aqua fortis',use:'was called "strong water" by old alchemists',k:'acid',ch:4,ing:{H:1,N:1,O:3},c:'#ffb36b',fact:'Alchemists called nitric acid aqua fortis, "strong water". It was used to separate gold from silver.',s:'sih'},
{id:'aquaregia',n:'Aqua regia',f:'3 HCl + HNO\u2083',al:'Royal water',use:'dissolves gold, the king of metals',k:'acid',ch:4,ing:{hcl:3,hno3:1},c:'#ff9a3d',fact:'Aqua regia is about 3 parts hydrochloric acid to 1 part nitric acid. It is named "royal water" because it dissolves gold.',s:'brit'},
{id:'mgo',n:'Magnesia',f:'MgO',use:'made the bright white flash in old camera flashes',k:'oxide',ch:2,ing:{Mg:1,O:1},c:'#ffffff',fact:'Burning magnesium makes an intense white light. Early camera flashes used it.',s:'rsc'},
{id:'cao',n:'Quicklime',f:'CaO',use:'is the white powder used in mortar and old plaster',k:'oxide',ch:2,ing:{Ca:1,O:1},c:'#f1ecd8',fact:'Quicklime is made by heating limestone. Add water and it gets hot enough to burn.',s:'pub'},
{id:'caoh2',n:'Slaked lime',f:'Ca(OH)\u2082',use:'builds the plaster and mortar of old walls',k:'base',ch:2,ing:{cao:1,water:1},c:'#e8f0e0',fact:'Adding water to quicklime is called slaking. The result is slaked lime, used in mortar and plaster for thousands of years.',s:'pub'},
{id:'caco3',n:'Chalk',f:'CaCO\u2083',use:'writes on blackboards and builds seashells',k:'salt',ch:2,ing:{caoh2:1,co2:1},byp:['water'],c:'#faf6ee',fact:'Chalk, limestone, marble and seashells are all mostly calcium carbonate.',s:'pub'},
{id:'rust',n:'Rust',f:'Fe\u2082O\u2083',al:'Crocus of Mars',use:'turns an old nail orange-brown',k:'oxide',ch:2,ing:{Fe:2,O:3},c:'#d9622b',fact:'Rust is iron combining with oxygen, helped by water. Alchemists called an iron oxide crocus of Mars.',s:'pub'},
{id:'al2o3',n:'Alumina',f:'Al\u2082O\u2083',use:'becomes rubies and sapphires with a pinch of colour',k:'oxide',ch:2,ing:{Al:2,O:3},c:'#ff4d6d',fact:'Rubies and sapphires are crystals of aluminium oxide. Traces of chromium make ruby red.',s:'brit'},
{id:'sio2',n:'Silica',f:'SiO\u2082',use:'is sand, quartz and the stuff glass is made from',k:'oxide',ch:2,ing:{Si:1,O:2},c:'#f2e2b8',fact:'Quartz and beach sand are mostly silicon dioxide. Melted, it becomes glass.',s:'pub'},
{id:'cuo',n:'Copper oxide',f:'CuO',use:'is the black coating on a heated penny',k:'oxide',ch:2,ing:{Cu:1,O:1},c:'#2b2f3a',fact:'Heating copper in air turns its surface black with copper oxide.',s:'pub'},
{id:'fes',n:'Iron sulfide',f:'FeS',use:'glows red when iron and sulfur are heated together',k:'mineral',ch:3,ing:{Fe:1,S:1},c:'#6a5a3a',fact:'Heated iron and sulfur react and glow by themselves. Fool\'s gold is a different compound, FeS\u2082.',s:'pub'},
{id:'zns',n:'Zinc sulfide',f:'ZnS',use:'makes glow-in-the-dark paint with a trace of copper',k:'mineral',ch:3,ing:{Zn:1,S:1},c:'#b6ff9a',fact:'ZnS with a little copper glows after being lit. It was used on old watch dials.',s:'pub'},
{id:'agcl',n:'Silver chloride',f:'AgCl',use:'darkens in sunlight: the heart of old photography',k:'salt',ch:3,ing:{Ag:1,Cl:1},c:'#e6e9f2',fact:'Light turns silver chloride grey-black. Early photographic paper relied on silver salts.',s:'brit'},
{id:'hgs',n:'Cinnabar',f:'HgS',al:'Vermilion',use:'makes the blood-red pigment vermilion',ask:'I paint old manuscripts and need the red pigment vermilion.',k:'mineral',ch:4,ing:{Hg:1,S:1},c:'#e0243a',fact:'Cinnabar, mercury sulfide, was ground into the red pigment vermilion. Mercury is toxic.',s:'pub'},
{id:'brass',n:'Brass',f:'Cu + Zn',use:'is the golden alloy of trumpets and door handles',k:'alloy',ch:3,ing:{Cu:1,Zn:1},c:'#e4b43a',fact:'Brass is copper and zinc. (Game ratio is simplified; real brass varies.)',s:'brit'},
{id:'bronze',n:'Bronze',f:'Cu\u2083Sn',use:'gave a whole age of history its name',k:'alloy',ch:3,ing:{Cu:3,Sn:1},c:'#c9803a',fact:'Bronze is mostly copper with tin (about 12% tin is typical). The Bronze Age began around 3300 BCE. Game ratio simplified.',s:'brit'},
{id:'steel',n:'Steel',f:'Fe\u2084C',use:'builds bridges and railways',k:'alloy',ch:3,ing:{Fe:4,C:1},c:'#aab4c8',fact:'Steel is iron with a little carbon (under about 2%). Game ratio simplified.',s:'brit'},
{id:'auhcl',n:'Liquid gold',f:'HAuCl\u2084',al:'Chloroauric acid',use:'turns a gold coin into a golden-yellow liquid',k:'acid',ch:4,ing:{Au:1,aquaregia:1},c:'#ffc61a',fact:'Gold dissolves in aqua regia as chloroauric acid. In WWII, George de Hevesy dissolved Nobel medals this way to hide them from the Nazis, then recovered the gold.',s:'nobel'},
{id:'hcn',n:'Hydrogen cyanide',f:'HCN',use:'is the small molecule behind a famous origin-of-life experiment',ask:'I teach origins-of-life class. Which small molecule did Joan Oro use in 1960 to form adenine?',k:'gas',ch:5,ing:{H:1,C:1,N:1},c:'#c9a7ff',fact:'HCN is hazardous and only handled in closed labs, but in 1960 Joan Oro showed that concentrated cyanide solutions can form adenine.',s:'wiki'},

function pickb(){return`<div class="pick">${BS.split('').map(b=>`<button class="base ${b} ${S.dna.pb==b?'sel':''}" data-a="pb" data-i="${b}">${b}</button>`).join('')}</div>`}
function dnaScr(){const D=S.dna;if(D.st=='end'){const avg=Math.round(D.sc.reduce((a,b)=>a+b,0)/D.sc.length);return`<h1>Clinic closed</h1><div class="panel glow" style="text-align:center"><div style="font-size:40px">${avg>=85?'\uD83C\uDF1F':'\uD83E\uDDEC'}</div><h2>${avg}% on level ${D.l}</h2><p>${D.sc.map(s=>s+'%').join(' \u00B7 ')}</p><p class="dim sm">Saved to your scores on this device.</p></div>${questHTML(D.q||[])}<button class="btn pri big" data-a="dl" data-i="${D.l}">Play again</button>`}
const p=D.p,l=D.l;let h=`<h1>${DN[l-1]}</h1><div class="row"><img src="${char(P.av,D.st=='fb'?(D.sc[D.sc.length-1]>=85?'happy':D.sc[D.sc.length-1]>=50?'worry':'cry'):'normal')}" width="63" height="72"><span class="chip">Patient ${D.i+1}/6</span><span class="sp" style="flex:1"></span><span class="chip g">${D.sc.reduce((a,b)=>a+b,0)/Math.max(1,D.sc.length)|0}% so far</span></div><p class="dim sm">${DINTRO[l-1]}</p><div class="panel">`;const fb=D.st=='fb';
if(l==1){const cls={};if(fb)[...p.top].forEach((c,i)=>cls[i]=D.ans[i]==CP[c]?'good':'bad');h+=`<small class="dim">Top strand</small>${tiles(p.top)}<small class="dim">Your strand</small><div class="bases">${p.top.split('').map((c,i)=>`<div class="base ${D.ans[i]||'q'} ${fb?cls[i]:''}">${D.ans[i]||'?'}</div>`).join('')}</div>`;if(!fb)h+=pickb()+`<div class="row c"><button class="btn" data-a="dundo">Undo</button><button class="btn pri" data-a="dcheck" ${D.ans.length==6?'':'disabled'}>Check</button></div>`}
if(l==2){const cls={};if(fb){cls[p.k]=D.sel==p.k?'good':'bad'}h+=`<small class="dim">Healthy copy</small>${tiles(p.ref,{sm:1})}<small class="dim">Patient copy (tap the wrong letter)</small>${tiles(p.pat,{click:fb?'':'dsel',sel:D.sel,cls,sm:1})}`;if(!fb)h+=`<small class="dim">Letter that belongs there</small>${pickb()}<div class="row c"><button class="btn pri" data-a="dpatch" ${D.sel!=null&&D.pb?'':'disabled'}>Patch</button></div>`}
if(l==3){h+=`<div class="row c" style="gap:18px">${p.sk?'<div class="chip k">HBB gene, codon 6</div>':''}</div><div class="row c" style="gap:14px"><div><small class="dim">Healthy</small><div class="cod">${[...p.a.replace(/U/g,'T')].map(c=>`<div class="base ${c}">${c}</div>`).join('')}</div></div><div style="font-size:24px">\u27A1</div><div><small class="dim">Patient</small><div class="cod">${[...p.b.replace(/U/g,'T')].map(c=>`<div class="base ${c}">${c}</div>`).join('')}</div></div></div>`;if(!fb)h+=`<p class="dim sm" style="text-align:center">What does this change do to the protein?</p><div class="row c">${['silent','missense','nonsense'].map(t=>`<button class="btn big" style="width:auto;flex:1" data-a="dopt" data-i="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>`}
if(l==4){const q=p.pat,tok=[];h+=`<small class="dim">${fb?'Healthy sequence':'Patient reads (letters grouped in 3):'}</small>`;if(fb)h+=tiles(p.h,{sm:1});else{h+='<div class="bases">';let hh='';for(let i=0;i<=q.length;i++){hh+=`<button class="gap ${D.sel===i?'sel':''}" data-a="dsel" data-i="${i}">+</button>`;if(i<q.length)hh+=`<div class="base sm2 ${q[i]}" ${i%3==2?'style="margin-right:6px"':''}>${q[i]}</div>`}h+=hh+'</div>';h+=`<p class="sm" style="text-align:center">Protein now: <b class="no">${tr(q)}</b>${q.length%3?' + leftover letters':''}</p><small class="dim">Missing base</small>${pickb()}<div class="row c"><button class="btn pri" data-a="dpatch" ${D.sel!=null&&D.pb?'':'disabled'}>Insert</button></div>`}}
if(l==5){const s=p.patient;const cls={};if(fb){for(let i=0;i<8;i++)cls[p.at+i]='';for(let i=0;i<3;i++)cls[p.at+8+i]='pam'}h+=`<small class="dim">Patient DNA${fb?' (PAM glowing)':''}</small>${tiles(s,{sm:1,cls})}<small class="dim">1. Choose the guide RNA</small><div class="col" style="display:grid;gap:6px">${p.opts.map((g,i)=>`<button class="btn ${D.g===i?'on':''}" data-a="dopt" data-i="${i}" ${fb?'disabled':''}>${g.replace(/T/g,'U')}</button>`).join('')}</div>`;if(!fb)h+=`<small class="dim">2. Repair template: which base should replace the faulty one?</small>${pickb()}<div class="row c"><button class="btn pri" data-a="dpatch" ${D.g!=null&&D.pb?'':'disabled'}>\u2702\uFE0F Cut &amp; repair</button></div>`}
h+='</div>';if(fb)h+=D.fbHTML+`<button class="btn pri big" data-a="dnext">${D.i>=5?'Finish':'Next patient'}</button>`;return h}
function dnaFinish(score,exp){const D=S.dna;D.sc.push(score);if(score==100){P.st.dna++}if(score>=85)sfx.ok();else sfx.bad();const f=pick(DF[D.l-1]);D.fbHTML=`<div class="panel ${score>=85?'glow':''}"><b>${score}%</b> ${exp}</div>${factHTML(f[0],f[1])}`;D.st='fb';save();render()}
function dnaCheck(kind,v){const D=S.dna,p=D.p;
if(kind=='c1'){let ok=0;[...p.top].forEach((c,i)=>{if(D.ans[i]==CP[c])ok++});const right=[...p.top].map(c=>CP[c]).join('');dnaFinish(Math.round(ok/6*100),ok==6?'All pairs right.':`${ok}/6 right. The strand should read <b>${right}</b>: A\u2194T and C\u2194G.`)}
if(kind=='c2'){const sc=(D.sel==p.k?50:0)+(D.pb==p.ref[p.k]?50:0);dnaFinish(sc,sc==100?`Fixed. Position ${p.k+1} had ${p.pat[p.k]} but should be ${p.ref[p.k]}. That is a single-letter swap (substitution).`:`The wrong letter was at position ${p.k+1}: ${p.pat[p.k]} should be ${p.ref[p.k]}.`)}
if(kind=='c3'){const x=aa(p.a),y=aa(p.b),ty=y=='*'?'nonsense':x==y?'silent':'missense',ok=v==ty;dnaFinish(ok?100:0,`${p.a.replace(/U/g,'T')} codes ${AAN[x]}; ${p.b.replace(/U/g,'T')} codes ${AAN[y]}. That is <b>${ty}</b>${ty=='silent'?': the same amino acid, no change.':ty=='missense'?': a different amino acid.':': a stop signal, so the protein ends early.'}`)}
if(kind=='c4'){const q=p.pat.slice(0,D.sel)+D.pb+p.pat.slice(D.sel),ok=q==p.h;dnaFinish(ok?100:0,ok?`Frame restored. Protein: ${tr(p.h)}.`:`The healthy sequence is ${p.h.match(/.{3}/g).join(' ')} (${tr(p.h)}). Without the lost letter every codon after it shifts and the protein comes out wrong.`)}
if(kind=='c5'){const g=p.opts[D.g],okg=g==p.sp,okb=D.pb==p.hb;const sc=(okg?50:0)+(okb?50:0);dnaFinish(sc,(okg?'The guide matches the site beside the PAM, so Cas9 cuts about 3 letters from it. ':'That guide does not match the patient\'s DNA next to a PAM, so Cas9 would not cut here. The right one was '+p.sp.replace(/T/g,'U')+'. ')+(okb?`The healthy base ${p.hb} is used to repair the cut.`:`The repair base should be ${p.hb}, as in the healthy gene.`))}}
// ---------- events
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,i=el.dataset.i;if(el.tagName=='A')e.preventDefault();if(a=='closebg'&&e.target!==el)return;
switch(a){
case'back':stopT();if(S.scr=='dna')go('dnamenu');else go('menu');return;
case'snd':P.sound=!P.sound;save();music();render();sfx.pop();return;
case'mus':P.music=!P.music;if(P.music)P.sound=true;save();music();render();return;
case'av':P.av[el.dataset.k]=+i;save();render();return;
case'rand':P.av={skin:rnd(6),hair:rnd(6),robe:rnd(6),gog:rnd(2),hc:rnd(6)};save();render();return;
case'start':P.name=($('#nm').value||'').trim().slice(0,14);P.started=true;save();go('menu');return;
case'chg':go('intro');return;
case'go':stopT();if(el.dataset.s=='lab')S.tgt=null;if(el.dataset.s=='orders')S.ord=null;go(el.dataset.s,el.dataset.t?{tab:el.dataset.t}:null);if(el.dataset.s=='orders')render();return;
case'thint':if(S.res)S.res.th=1;render();return;case'hint':S.hint=String(i);render();return;
case'brew':S.tgt=i;go('lab',{tgt:i});return;
case'add':if(S.tray.length<MAX){S.tray.push(i);S.res=null;sfx.pop()}else{S.shake=1;sfx.bad()}render();S.shake=0;return;
case'rm':{const k=S.tray.indexOf(i);if(k>=0)S.tray.splice(k,1);S.res=null;render();return}
case'clr':S.tray=[];S.res=null;render();return;
case'mix':doMix();return;
case'tm':S.tm=+i;render();return;
case'ostart':S.ord={n:0,sc:[],used:[],ph:'setup'};newOrder();S.tray=[];render();startTimer();return;
case'serve':serve(false);return;
case'onext':{const o=S.ord;if(o.n>=4){o.n++;o.ph='end';const avg=Math.round(o.sc.reduce((x,y)=>x+y,0)/o.sc.length);lbAdd('orders',avg);S.tray=[];render()}else{o.n++;newOrder();render();startTimer()}scrollTo(0,0);return}
case'tab':S.tab=i;render();return;
case'card':S.card=i;render();return;
case'close':case'closebg':S.card=null;render();return;
case'dl':S.dna={l:+i,i:0,sc:[],q:[]};dnamk();S.scr='dna';render();scrollTo(0,0);return;
case'pb':S.dna.pb=i;render();return;
case'dsel':S.dna.sel=+i;render();return;
case'dundo':S.dna.ans.pop();render();return;
case'dcheck':dnaCheck('c1');return;
case'dopt':{const D=S.dna;if(D.l==3)dnaCheck('c3',i);else{D.g=+i;render()}return}
case'dpatch':dnaCheck('c'+S.dna.l);return;
case'dnext':{const D=S.dna;if(D.i>=5){const avg=Math.round(D.sc.reduce((x,y)=>x+y,0)/D.sc.length);lbAdd('dna'+D.l,avg);if(avg>=85)P.stars++;save();D.q=checkQuests();D.st='end'}else{D.i++;dnamk()}render();scrollTo(0,0);return}
}});
// level 1 base picks
document.addEventListener('click',e=>{const el=e.target.closest('[data-a="pb"]');if(el&&S.scr=='dna'&&S.dna.l==1&&S.dna.st=='ask'&&S.dna.ans.length<6){S.dna.ans.push(el.dataset.i);sfx.pop();render()}},true);

render();
</script></body></html>
